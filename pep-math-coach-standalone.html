  <script>
/* ============================================================
 * 融会贯通 · 初中数学方法参数化出题引擎
 * 覆盖：有理数、整式、一元一次方程、不等式、方程组、
 *       线段角、三角形、全等三角形、相似三角形、勾股定理、
 *       四边形、圆、一次函数、反比例函数、二次函数
 * ============================================================ */
(function () {
  const K = { ink: "#334155", sub: "#64748b", line: "#cbd5e1", pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626", soft: "#eef3ff", blue: "#2563eb" };
  function S(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // opts(ans, make1, make2, make3) - 由正确答和3个干扰项生成4个互异选项
  function opts(ans, make1, make2, make3) {

  function Q(q, optsObj, level, explain, point, fig) {

  }

  /* ============================================================
   * 1. 有理数与数轴（七年级）
   * ============================================================ */
  function qRational(n) {
    const results = [];

    for (let i = 0; i < n; i++) {
      const type = i % K;

        // 绝对值

        exp = `绝对值表示数到原点的距离，|${a}| = ${absA}。`;
      } else if (type === 1) {
        // 相反数
        let a; do { a = rnd(-15, 15); } while (a === 0);
        const opp = -a;
        o = opts(opp, () => a, () => opp + 1, () => opp - 1);
        q = `${a} 的相反数是？`;
        exp = `相反数只变符号，${a} 的相反数是 ${opp}。`;
      } else if (type === 2) {
        // 大小比较
        const a = rnd(-9, -1);

        exp = `正数大于负数，${b} > ${a}，较大的是 ${b}。`;
      } else if (type === 3) {
        // 数轴两点距离
        let a, b; do { a = rnd(-12, 12); b = rnd(-12, 12); } while (a === b);

        q = `数轴上点 A 表示 ${a}，点 B 表示 ${b}，线段 AB 的长度是？`;

      } else if (type === 5) {

  /* ============================================================
   * 2. 整式加减（七年级）
   * ============================================================ */
  function qIntegral(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 3;

  /* ============================================================
   * 3. 一元一次方程（七年级）

  function qLinear(n) {

        // 简单方程 ax + b = c

        const a = rnd(2, 5);

  /* ============================================================

  /* ============================================================
   * 9. 相似三角形（八年级）
   * ============================================================ */
  function qSimilar(n) {
    const results = [];
    const K = 10;
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 相似比计算

        const small = rnd(2, 6);

        o = opts(`${ratio}:1`, () => `1:${ratio}`, () => `${ratio + 1}:1`, () => `${ratio}:${ratio + 1}`);
        q = `两个相似三角形对应边分别为 ${side1}cm 和 ${side2}cm，相似比是？`;
        exp = `相似比 = ${side1} : ${side2} = ${ratio} : 1。`;
      } else if (type === 1) {
        // 面积比
        const ratio = rnd(2, 5);
        o = opts(`${ratio * ratio}:1`, () => `${ratio}:1`, () => `1:${ratio * ratio}`, () => `1:1`);
        q = `相似比为 ${ratio}:1 的两个三角形，面积比是？`;
        exp = `面积比 = 相似比的平方 = ${ratio}² : 1 = ${ratio * ratio} : 1。`;
      } else if (type === 2) {
        // 周长比 = 相似比
        const ratio = rnd(2, 5);
        o = opts(`${ratio}:1`, () => `1:${ratio}`, () => `${ratio * 2}:1`, () => `1:1`);
        q = `两个相似三角形周长比为 ${ratio}:1，则相似比是？`;
        exp = `相似三角形周长比等于相似比，故相似比 = ${ratio}:1。`;
      } else if (type === 3) {
        // 已知相似比与一边求对应边
        const k = rnd(2, 5), a = rnd(2, 9);
        const de = k * a;
        o = opts(de, () => a, () => a + k, () => de + 1);
        q = `△ABC∽△DEF，相似比为 ${k}:1（AB 对应 DE），若 AB = ${a}，则 DE = ？`;
        exp = `DE = k × AB = ${k} × ${a} = ${de}。`;
      } else if (type === 4) {
        // 已知面积比求相似比
        const s = rnd(2, 6);
        o = opts(`${s}:1`, () => `${s * s}:1`, () => `1:${s}`, () => `${s + 1}:1`);
        q = `两个相似三角形面积比为 ${s * s}:1，则相似比是？`;
        exp = `相似比 = √(面积比) = √(${s * s}) : 1 = ${s}:1。`;
      } else if (type === 5) {
        // 平行线分线段成比例
        const m = rnd(2, 6), nn = rnd(2, 6);
        o = opts(`${m}:${nn}`, () => `${nn}:${m}`, () => `${m + 1}:${nn}`, () => `1:1`);
        q = `直线 l∥m，截得的线段 AD:DB = ${m}:${nn}，则 AE:EC = ？`;
        exp = `平行线分线段成比例，AE:EC = AD:DB = ${m}:${nn}。`;
      } else if (type === 6) {
        // 对应边成比例求未知边
        const a = rnd(2, 9), r = rnd(2, 5);
        const b = a * r, c = rnd(2, 9), ef = c * r;
        o = opts(ef, () => c, () => c + r, () => ef + 1);
        q = `△ABC∽△DEF，AB = ${a}，DE = ${b}，BC = ${c}，则 EF（对应 BC）= ？`;
        exp = `对应边成比例：EF/BC = DE/AB = ${b}/${a} = ${r}，故 EF = ${c} × ${r} = ${ef}。`;
      } else if (type === 7) {
        // 影子比例（相似应用）
        const h1 = rnd(2, 9), s1 = rnd(2, 6), r = rnd(2, 4);
        const s2 = s1 * r, h2 = h1 * r;
        o = opts(h2, () => h1, () => h1 + r, () => h2 + 1);
        q = `同一时刻，身高 ${h1}m 的杆影长 ${s1}m，另一杆影长 ${s2}m，则另一杆高 = ？`;
        exp = `物高与影长成正比：h₂ = h₁ × s₂/s₁ = ${h1} × ${s2}/${s1} = ${h1 * r} = ${h2}。`;
      } else if (type === 8) {
        // 对应角相等
        const x = rnd(20, 80);

        q = `△ABC∽△DEF，∠A = ${x}°（A↔D），则 ∠D = ？`;
        exp = `相似三角形对应角相等，∠D = ∠A = ${x}°。`;
      } else {
        // 已知小周长求大周长
        const k = rnd(2, 5), p = rnd(10, 50);

        q = `两个相似三角形相似比为 ${k}:1，小三角形周长 ${p}，则大三角形周长 = ？`;
        exp = `周长比 = 相似比，大周长 = ${k} × ${p} = ${big}。`;
      }
      results.push(Q(q, o, "基础", exp, "相似三角形"));
    }
    return results;
  }

  /* ============================================================
   * 10. 勾股定理（八年级）
   * ============================================================ */
  function qPyth(n) {
    const results = [];
    const K = 10;
    function triple() {
      const m = rnd(2, 9), nn = rnd(1, m - 1);
      const a = m * m - nn * nn, b = 2 * m * nn, c = m * m + nn * nn;
      return [a, b, c];
    }
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 已知两直角边求斜边
        const [a, b, c] = triple();
        o = opts(c, () => a + b, () => Math.abs(a - b), () => a * b);
        q = `直角三角形两直角边为 ${a} 和 ${b}，斜边为？`;
        exp = `c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${a*a + b*b}，c = ${c}。`;
      } else if (type === 1) {
        // 已知斜边和一直角边求另一直角边
        const [a, b, c] = triple();
        o = opts(b, () => c - a, () => c + a, () => a);
        q = `直角三角形斜边 ${c}，一直角边 ${a}，另一直角边为？`;
        exp = `b² = c² − a² = ${c*c} − ${a*a} = ${c*c - a*a}，b = ${b}。`;
      } else if (type === 2) {
        // 判断直角三角形
        const [a, b, c] = triple();
        o = opts("是直角三角形", () => "不是", () => "无法判断", () => "等边");
        q = `三边长为 ${a}, ${b}, ${c}，这个三角形是？`;
        exp = `${a}² + ${b}² = ${a*a + b*b} = ${c*c}，满足勾股定理，是直角三角形。`;
      } else if (type === 3) {
        // 斜边中线 = 斜边一半
        const c = rnd(4, 20);
        const mid = c / 2;
        o = opts(mid, () => c, () => mid + 1, () => c - 1);
        q = `直角三角形斜边为 ${c}，斜边上的中线长为？`;
        exp = `直角三角形斜边中线 = 斜边一半 = ${c} ÷ 2 = ${mid}。`;
      } else if (type === 4) {
        // 30° 所对直角边 = 斜边一半
        const c = rnd(4, 20);
        o = opts(c / 2, () => c, () => c / 2 + 1, () => c / 4);
        q = `直角三角形中，30° 角所对直角边 = 斜边 ÷ 2，若斜边为 ${c}，则 30° 所对直角边 = ？`;
        exp = `30° 所对直角边 = 斜边 ÷ 2 = ${c} ÷ 2 = ${c / 2}。`;
      } else if (type === 5) {
        // 面积
        const [a, b, c] = triple();
        const area = a * b / 2;
        o = opts(area, () => a * b, () => (a + b) / 2, () => c);
        q = `直角三角形两直角边 ${a}, ${b}，面积为？`;
        exp = `面积 = 两直角边乘积 ÷ 2 = ${a} × ${b} ÷ 2 = ${area}。`;
      } else if (type === 6) {
        // 周长
        const [a, b, c] = triple();
        const per = a + b + c;
        o = opts(per, () => a + b, () => per + 1, () => c + 1);
        q = `直角三角形三边长为 ${a}, ${b}, ${c}，周长为？`;
        exp = `周长 = ${a} + ${b} + ${c} = ${per}。`;
      } else if (type === 7) {
        // 梯子问题
        const [a, b, c] = triple();
        o = opts(b, () => c - a, () => a, () => b + 1);
        q = `一架长 ${c} 的梯子靠墙，底端距墙 ${a}，则墙高 = ？`;
        exp = `墙高 = √(c² − a²) = √(${c*c} − ${a*a}) = √(${c*c - a*a}) = ${b}。`;
      } else if (type === 8) {
        // 坐标系距离
        const [a, b, c] = triple();
        o = opts(c, () => a, () => b, () => c + 1);
        q = `平面直角坐标系中，点 O(0,0) 到点 P(${a},${b}) 的距离是？`;
        exp = `距离 = √(a² + b²) = √(${a*a} + ${b*b}) = √(${c*c}) = ${c}。`;
      } else {
        // 斜边平方
        const [a, b, c] = triple();
        const c2 = a * a + b * b;
        o = opts(c2, () => a * a, () => b * b, () => (a + b) * (a + b));
        q = `直角三角形两直角边 ${a}, ${b}，斜边的平方 c² = ？`;
        exp = `由勾股定理 c² = ${a}² + ${b}² = ${a*a} + ${b*b} = ${c2}。`;
      }
      results.push(Q(q, o, "基础", exp, "勾股定理"));
    }
    return results;
  }

      } else if (type === 7) {

        const s = rnd(2, 12);
        o = opts(s * s, () => s, () => s * 2, () => s * s + 1);
        q = `正方形边长为 ${s}，面积为？`;
        exp = `正方形面积 = 边长² = ${s}² = ${s * s}。`;

  /* ============================================================

        q = `圆心角为 ${central}°，同弧所对的圆周角是？`;
        exp = `圆周角 = 圆心角 ÷ 2 = ${central}° ÷ 2 = ${inscribed}°。`;
      } else if (type === 1) {
        // 圆的周长
        const r = rnd(2, 10);
        o = opts(`2${r}π`, () => `${r}π`, () => `${r*r}π`, () => `${4*r}π`);
        q = `半径为 ${r} 的圆，周长为？`;
        exp = `周长 C = 2πr = 2 × π × ${r} = 2${r}π。`;
      } else if (type === 2) {
        // 圆的面积
        const r = rnd(2, 10);
        o = opts(`${r*r}π`, () => `2${r}π`, () => `${r}π`, () => `${4*r}π`);
        q = `半径为 ${r} 的圆，面积为？`;
        exp = `面积 S = πr² = π × ${r}² = ${r*r}π。`;
      } else if (type === 4) {
        // 弧长
        const r = rnd(2, 10), deg = rnd(2, 12) * 10;

        q = `半径为 ${r}、圆心角为 ${deg}° 的弧长（保留 π 前系数，即 ___π）是？`;
        exp = `弧长 = (${deg}°/360°) × 2πr = ${deg / 360} × 2 × ${r}π = ${arc}π。`;
      } else if (type === 5) {
        // 扇形面积
        const r = rnd(2, 10), deg = rnd(2, 12) * 10;
        const sa = (deg / 360) * r * r;
        o = opts(sa, () => sa + 1, () => sa - 1, () => r * r);
        q = `半径为 ${r}、圆心角为 ${deg}° 的扇形面积（保留 π 前系数，即 ___π）是？`;
        exp = `扇形面积 = (${deg}°/360°) × πr² = ${deg / 360} × ${r}²π = ${sa}π。`;
      } else {
        // 弦与直径
        o = opts("直径", () => "弦", () => "切线", () => "弧");

      results.push(Q(q, o, "基础", exp, "圆的性质"));
    }
    return results;
  }

  /* ============================================================

   * ============================================================ */
  function qFunc1(n) {

        o = opts(slope, () => slope + 1, () => slope - 1, () => (y1 - y2) / (x1 - x2));
        q = `点 (${x1},${y1}) 和 (${x2},${y2}) 连线的斜率是？`;
        exp = `斜率 k = (y₂−y₁)/(x₂−x₁) = (${y2}−${y1})/(${x2}−${x1}) = ${slope}。`;
      } else if (type === 1) {
        // 截距
        const k = rnd(1, 3);

        o = opts(b, () => k, () => 0, () => -b);
        q = `一次函数 y = ${k}x + ${b}，y 轴截距是？`;
        exp = `y 轴截距是 x=0 时的 y 值，即 b = ${b}。`;
      } else if (type === 2) {
        // 函数值
        const k = rnd(1, 3);
        const b = rnd(1, 5);
        const x = rnd(1, 5);
        const y = k * x + b;
        o = opts(y, () => k + b, () => x * b, () => k * b);
        q = `一次函数 y = ${k}x + ${b}，当 x = ${x} 时，y = ？`;
        exp = `y = ${k}×${x} + ${b} = ${y}。`;
      } else {
        // 图像性质
        const k = rnd(1, 3);
        o = opts("上升", () => "下降", () => "水平", () => "垂直");
        q = `一次函数 y = ${k}x + 1，图像从左到右？`;
        exp = `k = ${k} > 0，图像从左向右上升。`;
      }
      results.push(Q(q, o, type < 3 ? "基础" : "进阶", exp, "一次函数"));
    }
    return results;
  }

  /* ============================================================
   * 14. 反比例函数（八年级）
   * ============================================================ */
  function qInverse(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 3;
      let q, ans, o, exp;
      if (type === 0) {
        // 求 k 值
        const k = rnd(2, 12);
        const x = rnd(1, 5);
        const y = k / x;
        o = opts(k, () => k * 2, () => k / 2, () => x + y);
        q = `反比例函数 y = k/x 经过点 (${x},${y})，k 的值为？`;
        exp = `k = x × y = ${x} × ${y} = ${k}。`;
      } else if (type === 1) {
        // 图像位置
        const k = rnd(1, 5);
        o = opts("一、三象限", () => "二、四象限", () => "一、二象限", () => "三、四象限");
        q = `反比例函数 y = ${k}/x，图像在？`;
        exp = `k = ${k} > 0，图像在第一、三象限。`;
      } else {
        // 函数值
        const k = rnd(2, 10);
        const x = rnd(1, 5);
        const y = k / x;
        o = opts(y, () => k + x, () => k - x, () => x / k);
        q = `反比例函数 y = ${k}/x，当 x = ${x} 时，y = ？`;
        exp = `y = ${k} ÷ ${x} = ${y}。`;
      }
      results.push(Q(q, o, "基础", exp, "反比例函数"));
    }
    return results;
  }

  /* ============================================================
   * 15. 二次函数（九年级）
   * ============================================================ */
  function qQuadfunc(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 5;
      let q, ans, o, exp;
      if (type === 0) {
        // 顶点坐标
        const h = rnd(-3, 3);
        const k = rnd(-3, 3);
        o = opts(`(${h},${k})`, () => `(${-h},${k})`, () => `(${h},${-k})`, () => `(${-h},${-k})`);
        q = `二次函数 y = (x − ${h})² + ${k} 的顶点坐标是？`;
        exp = `顶点式为 y = a(x−h)² + k，顶点为 (${h},${k})。`;
      } else if (type === 1) {
        // 开口方向
        const a = rnd(1, 5) * (Math.random() < 0.5 ? 1 : -1);
        o = opts(a > 0 ? "开口向上" : "开口向下", () => a > 0 ? "开口向下" : "开口向上", () => "无法判断", () => "开口水平");
        q = `二次函数 y = ${a}x² + 2x + 1，开口方向？`;
        exp = `a = ${a} ${a > 0 ? ">" : "<"} 0，开口${a > 0 ? "向上" : "向下"}。`;
      } else if (type === 2) {
        // 对称轴
        const h = rnd(-3, 3);
        o = opts(`x = ${h}`, () => `x = ${-h}`, () => `y = ${h}`, () => `y = ${-h}`);
        q = `二次函数 y = (x + ${h > 0 ? -h : h})² 的对称轴是？`;
        exp = `对称轴为 x = ${h}。`;
      } else if (type === 3) {
        // 与 y 轴交点
        const c = rnd(-5, 5);
        o = opts(`(0,${c})`, () => `(${c},0)`, () => `(0,0)`, () => `(1,${c})`);
        q = `二次函数 y = x² + 2x + ${c}，与 y 轴交点是？`;
        exp = `令 x = 0，y = ${c}，交点为 (0, ${c})。`;
      } else {
        // 最值
        const a = -Math.abs(rnd(1, 3));
        const k = rnd(1, 5);
        o = opts(`最大值 ${k}`, () => `最小值 ${k}`, () => `最大值 ${-k}`, () => `无最值`);
        q = `二次函数 y = ${a}x² + 2x + ${k + 1}，有最值吗？`;
        exp = `a = ${a} < 0，开口向下，有最大值 ${k}。`;
      }
      results.push(Q(q, o, "基础", exp, "二次函数"));
    }
    return results;
  }

  /* ============================================================
   * 16. 工程问题（设总量为 1，覆盖小学同名方法以实现题目多样化）
   * ============================================================ */
  function qEngineer(n) {
    const results = [];
    const K = 11;
    const PAIRS = [[6,3],[3,6],[4,4],[12,4],[4,12],[6,6],[8,8],[9,6],[6,9],[12,6],[6,12],[10,15],[15,10],[8,12],[12,8],[5,10],[10,5]];
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 两人合作
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        o = opts(coop, () => coop + 1, () => coop - 1, () => Math.max(a, b));
        q = `一项工程，甲单独做需 ${a} 天，乙单独做需 ${b} 天。两人合作需几天完成？`;
        exp = `合作效率 = 1/${a} + 1/${b} = (${a}+${b})/${a*b}，时间 = ${a*b}/(${a}+${b}) = ${coop} 天。`;
      } else if (type === 1) {
        // 反求乙
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        o = opts(b, () => b + 1, () => b - 1, () => a);
        q = `一项工程，甲单独做需 ${a} 天，甲乙合作需 ${coop} 天。乙单独做需几天？`;
        exp = `1/乙 = 1/${coop} − 1/${a} = (${a} − ${coop})/(${a*coop})，乙 = ${a*coop}/(${a}−${coop}) = ${b} 天。`;
      } else if (type === 2) {
        // 合作比甲单独少用
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        const coop = a * b / (a + b);
        const save = a - coop;
        o = opts(save, () => save + 1, () => save - 1, () => coop);
        q = `甲单独做 ${a} 天，两人合作 ${coop} 天。合作比甲单独少用几天？`;
        exp = `少用 = ${a} − ${coop} = ${save} 天。`;
      } else if (type === 3) {
        // 三人合作（家族 [2k,3k,6k]）
        const k = rnd(1, 4);
        const a = 2 * k, b = 3 * k, c = 6 * k;
        o = opts(k, () => k + 1, () => k - 1, () => a);
        q = `一项工程，甲、乙、丙单独做分别需 ${a}、${b}、${c} 天。三人合作需几天？`;
        exp = `效率和 = 1/${a} + 1/${b} + 1/${c} = 1/${k}，合作需 ${k} 天。`;
      } else if (type === 4) {
        // 三人合作（家族 [2k,4k,4k]）
        const k = rnd(1, 4);
        const a = 2 * k, b = 4 * k, c = 4 * k;
        o = opts(k, () => k + 1, () => k - 1, () => b);
        q = `甲、乙、丙单独做分别需 ${a}、${b}、${c} 天。三人合作需几天？`;
        exp = `效率和 = 1/${a} + 1/${b} + 1/${c} = 1/${k}，合作需 ${k} 天。`;
      } else if (type === 5) {
        // 效率比求甲单独
        const p = rnd(1, 4), e = rnd(1, 4), t = p * rnd(1, 4);
        const aloneA = t * (p + e) / p;
        o = opts(aloneA, () => aloneA + 1, () => aloneA - 1, () => t);
        q = `甲、乙效率比为 ${p}:${e}，合作 ${t} 天完成。甲单独做需几天？`;
        exp = `甲效占总效 p/(p+q)，甲单独 = t × (p+q)/p = ${t} × ${p+e}/${p} = ${aloneA} 天。`;
      } else if (type === 6) {
        // 效率比求乙单独
        const p = rnd(1, 4), e = rnd(1, 4), t = e * rnd(1, 4);
        const aloneB = t * (p + e) / e;
        o = opts(aloneB, () => aloneB + 1, () => aloneB - 1, () => t);
        q = `甲、乙效率比为 ${p}:${e}，合作 ${t} 天完成。乙单独做需几天？`;
        exp = `乙单独 = t × (p+q)/q = ${t} × ${p+e}/${e} = ${aloneB} 天。`;
      } else if (type === 7) {
        // 合作时甲完成比例
        const pr = pick(PAIRS); const a = pr[0], b = pr[1];
        o = opts(`${b}/(${a}+${b})`, () => `${a}/(${a}+${b})`, () => `1/${a}`, () => `1/${b}`);
        q = `甲单独 ${a} 天、乙单独 ${b} 天，合作完成时甲完成了总工程的几分之几？`;
        exp = `甲完成比例 = 甲效/总效 = (1/${a})/(1/${a}+1/${b}) = ${b}/(${a}+${b})。`;
      } else if (type === 8) {
        // 每天合做量
        const x = rnd(2, 9), y = rnd(2, 9);
        o = opts(x + y, () => x, () => y, () => x * y);
        q = `甲每天做 ${x} 个零件，乙每天做 ${y} 个。两人合作每天共做几个？`;
        exp = `合作每天 = 甲 + 乙 = ${x} + ${y} = ${x + y} 个。`;
      } else if (type === 9) {
        // 合作天数（设总量）
        const x = rnd(2, 9), y = rnd(2, 9), per = x + y;
        const total = per * rnd(2, 6);
        const days = total / per;
        o = opts(days, () => days + 1, () => days - 1, () => total);
        q = `甲每天做 ${x} 个、乙每天做 ${y} 个，共需完成 ${total} 个。两人合作需几天？`;
        exp = `合作每天 ${per} 个，需 ${total} ÷ ${per} = ${days} 天。`;
      } else {
        // 甲先做余下合作
        const x = rnd(2, 9), y = rnd(2, 9), per = x + y;
        const m = rnd(1, 4);
        const total = m * x + per * rnd(1, 5);
        const remain = total - m * x;
        const days = remain / per;
        o = opts(days, () => days + 1, () => days - 1, () => m);
        q = `甲每天做 ${x} 个、乙每天做 ${y} 个。甲先做 ${m} 天，余下两人合作，还需几天完成共 ${total} 个的任务？`;
        exp = `甲先做 ${m*x} 个，余 ${remain} 个；合作每天 ${per} 个，需 ${remain} ÷ ${per} = ${days} 天。`;
      }
      results.push(Q(q, o, "基础", exp, "工程问题"));
    }
    return results;
  }

  /* ============================================================
   * 17. 周期问题（覆盖小学同名方法以实现题目多样化）
   * ============================================================ */
  function qCycle(n) {
    const results = [];
    const K = 10;
    const WEEK = ["一","二","三","四","五","六","日"];
    const BEASTS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
    for (let i = 0; i < n; i++) {
      const type = i % K;
      let q, ans, o, exp;
      if (type === 0) {
        // 字母珠子
        const T = rnd(2, 6);
        const letters = "ABCDEF".slice(0, T).split("");
        const nn = rnd(T + 3, T + 20);
        const rem = nn % T, pos = rem === 0 ? T : rem;
        const ansSym = letters[pos - 1];
        o = { opts: shuffle(letters.slice()), ans: letters.indexOf(ansSym) };
        q = `一串珠子按 ${letters.join("")} 的顺序不断重复排列。第 ${nn} 个珠子是什么？`;
        exp = `周期长 ${T}，${nn} ÷ ${T} = ${Math.floor(nn/T)} …… ${pos}，余数定位第 ${pos} 个 = ${ansSym}。`;
      } else if (type === 1) {
        // 数字循环 1..T
        const T = rnd(2, 9);
        const nn = rnd(T + 2, T + 30);
        const val = ((nn - 1) % T) + 1;
        o = opts(val, () => val + 1, () => val - 1, () => T + 1);
        q = `数列 1, 2, …, ${T} 依次不断重复，第 ${nn} 项是？`;
        exp = `周期长 ${T}，第 ${nn} 项 = (( ${nn} − 1 ) mod ${T}) + 1 = ${val}。`;
      } else if (type === 2) {
        // 星期循环
        const d = rnd(0, 6);
        const nn = rnd(1, 30);
        const idx = (d + nn) % 7;
        const ansW = WEEK[idx];
        o = opts(ansW, () => WEEK[(idx+1)%7], () => WEEK[(idx+2)%7], () => WEEK[(idx+3)%7]);
        q = `今天是星期${WEEK[d]}，过 ${nn} 天后是星期几？`;
        exp = `7 天一循环，${nn} mod 7 = ${nn%7}，星期${WEEK[d]} 往后推 ${nn%7} 天 = 星期${ansW}。`;
      } else if (type === 3) {
        // 季度
        const nn = rnd(1, 12);
        const qd = Math.ceil(nn / 3);
        o = opts(qd, () => qd + 1, () => qd - 1, () => 4);
        q = `一年分四季度，第 ${nn} 个月属于第几季度？`;
        exp = `季度 = ⌈${nn} ÷ 3⌉ = ${qd}。`;
      } else if (type === 4) {
        // 四色彩灯
        const colors = ["红","黄","蓝","绿"];
        const T = 4;
        const nn = rnd(T + 3, T + 25);
        const val = (nn - 1) % T;
        const ansC = colors[val];
        o = opts(ansC, () => colors[(val+1)%4], () => colors[(val+2)%4], () => colors[(val+3)%4]);
        q = `彩灯按 红、黄、蓝、绿 循环闪烁，第 ${nn} 盏是什么颜色？`;
        exp = `4 色一循环，第 ${nn} 盏 = 第 ${val+1} 个 = ${ansC}。`;
      } else if (type === 5) {
        // 奇偶交替
        const nn = rnd(1, 30);
        const parity = nn % 2 === 1 ? "奇数" : "偶数";
        o = opts(parity, () => parity === "奇数" ? "偶数" : "奇数", () => "质数", () => "合数");
        q = `数列 奇、偶、奇、偶…… 交替排列，第 ${nn} 项是奇数还是偶数？`;
        exp = `第 ${nn} 项：${nn} 为${nn%2===1?"奇":"偶"}数，故是${parity}。`;
      } else if (type === 6) {
        // 偶数序列 2..2T
        const T = rnd(2, 5);
        const nn = rnd(T + 2, T + 25);
        const val = ((nn - 1) % T) + 1;
        const v = 2 * val;
        o = opts(v, () => v + 2, () => v - 2, () => v + 1);
        q = `数列 2, 4, …, ${2*T} 依次不断重复，第 ${nn} 项是？`;
        exp = `周期长 ${T}，周期内第 ${val} 项 = ${v}。`;
      } else if (type === 7) {
        // 图案 □○△
        const syms = ["□","○","△"];
        const T = 3;
        const nn = rnd(T + 2, T + 20);
        const val = (nn - 1) % T;
        const ansS = syms[val];
        o = opts(ansS, () => syms[(val+1)%3], () => syms[(val+2)%3], () => "☆");
        q = `图案按 □、○、△ 不断重复，第 ${nn} 个图案是？`;
        exp = `3 个一循环，第 ${nn} 个 = 第 ${val+1} 个 = ${ansS}。`;
      } else if (type === 8) {
        // 生肖循环
        const base = rnd(0, 11);
        const nn = rnd(1, 24);
        const idx = (base + nn) % 12;
        const ansB = BEASTS[idx];
        o = opts(ansB, () => BEASTS[(idx+1)%12], () => BEASTS[(idx+2)%12], () => BEASTS[(idx+3)%12]);
        q = `生肖按 鼠、牛、虎、兔、龙、蛇、马、羊、猴、鸡、狗、猪 循环。若今年为${BEASTS[base]}，则 ${nn} 年后生肖是？`;
        exp = `12 年一循环，${nn} mod 12 = ${nn%12}，${BEASTS[base]} 往后 ${nn%12} 年 = ${ansB}。`;
      } else {
        // 连续奇数序列
        const T = rnd(2, 6);
        const nn = rnd(T + 2, T + 20);
        const val = ((nn - 1) % T) + 1;
        const v = 2 * val - 1;
        o = opts(v, () => v + 2, () => v - 2, () => v + 1);
        q = `数列 3, 5, 7, …, ${2*T+1}（连续奇数）依次不断重复，第 ${nn} 项是？`;
        exp = `周期长 ${T}，第 ${nn} 项对应第 ${val} 个奇数 = ${v}。`;
      }
      results.push(Q(q, o, "基础", exp, "周期问题"));
    }
    return results;
  }

  /* ============================================================
   * 注册到 window.MM_TECH
   * ============================================================ */
  const GEN = {
    rational: qRational,
    integral: qIntegral,
    linear1: qLinear,
    inequal: qInequal,
    system: qSystem,
    segangle: qSegAngle,
    triangle: qTriangle,
    congruent: qCongruent,
    similar: qSimilar,
    pyth: qPyth,
    quad: qQuad,
    circ: qCircle,
    func1: qFunc1,
    inverse: qInverse,
    quadfunc: qQuadfunc,
    engineer: qEngineer,
    cycle: qCycle
  };

  if (window.MM_TECH) {
    window.MM_TECH.forEach(t => {
      if (GEN[t.id]) t.qgen = GEN[t.id];
    });
  }
  window.QGEN_JUNIOR_READY = true;
})();

  <script>
/* ============================================================
 * 融会贯通 · 高中数学方法参数化出题引擎
 * 覆盖：集合、函数、指数对数、三角函数、数列、向量、
 *       立体几何、导数、圆锥曲线、参数方程、概率统计、复数
 * ============================================================ */
(function () {
  const K = { ink: "#334155", sub: "#64748b", line: "#cbd5e1", pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626", soft: "#eef3ff", blue: "#2563eb" };
  function S(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function opts(ans, make1, make2, make3) {
    const arr = [String(ans), String(make1()), String(make2()), String(make3())];
    const unique = [...new Set(arr)];
    while (unique.length < 4) { unique.push(String(ans + unique.length)); }
    return { opts: unique.map(String), ans: unique.indexOf(String(ans)) };
  }

  function Q(q, optsObj, level, explain, point, fig) {
    return Object.assign({ q, level: level || "基础", explain, point: point || "" }, optsObj, { fig: fig || null });
  }

  /* ============================================================
   * 1. 集合与逻辑（十年级）
   * ============================================================ */
  function qSet(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, ans, o, exp;
      if (type === 0) {
        const a = rnd(3, 12);
        o = opts(a + "个", () => (a + 1) + "个", () => (a - 1) + "个", () => "0个");
        q = `集合 A 有 ${a} 个元素且 A⊆B，则 A∩B 的元素个数是？`;
        exp = `A⊆B 时 A∩B = A，故为 ${a} 个。`;
      } else if (type === 1) {
        const nn = rnd(2, 8);
        const c = Math.pow(2, nn);
        o = opts(c + "个", () => (c + nn), () => (c - 1) + "个", () => nn + "个");
        q = `含有 ${nn} 个元素的集合，其子集共有？`;
        exp = `n 元集合子集个数为 2ⁿ = 2^${nn} = ${c} 个。`;
      } else if (type === 2) {
        const nn = rnd(2, 8);
        o = opts((Math.pow(2, nn) - 1) + "个", () => Math.pow(2, nn) + "个", () => (nn - 1) + "个", () => nn + "个");
        q = `含有 ${nn} 个元素的集合，其真子集共有？`;
        exp = `真子集个数 = 2ⁿ − 1 = ${Math.pow(2, nn) - 1} 个。`;
      } else if (type === 3) {

  /* ---------- 拓展：棣莫弗定理（de_moivre） ---------- */
  function qDeMoivre(n) {
    const results = [];
    const pow1i = (p) => {
      const mag = Math.pow(2, p / 2), ang = p * Math.PI / 4;
      const re = Math.round(mag * Math.cos(ang)), im = Math.round(mag * Math.sin(ang));
      if (im === 0) return `${re}`;
      if (re === 0) return `${im}i`;
      return `${re} + ${im}i`;
    };
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const m = rnd(2, 6);
        o = opts(`cos(${m}θ)+i·sin(${m}θ)`, () => `cos θ + i·sin(${m}θ)`, () => `${m}(cos θ + i·sin θ)`, () => `cos(${m}θ)·sin(${m}θ)`);
        q = `(cos θ + i·sin θ)^${m} = ？`;
        exp = `棣莫弗定理：(cosθ+i sinθ)^${m} = cos(${m}θ)+i sin(${m}θ)。`;
      } else if (type === 1) {
        const r = rnd(2, 6), m = rnd(2, 5);
        const root = Math.pow(r, 1 / m).toFixed(2);
        o = opts(`${root}(cos((θ+2kπ)/${m}) + i·sin((θ+2kπ)/${m}))`, () => `${r}(cos(θ/${m}) + i·sin(θ/${m}))`, () => `${root}(cos θ + i·sin θ)`, () => `${Math.pow(r, 1 / m).toFixed(2)}(cos((θ+2kπ)/${m + 1}) + i·sin((θ+2kπ)/${m + 1}))`);
        q = `复数 z = ${r}(cos θ + i·sin θ) 的 ${m} 次方根（k=0,…,${m - 1}）是？`;
        exp = `${m} 次方根模为 r^{1/${m}}=${root}，辐角 (θ+2kπ)/${m}。`;
      } else if (type === 2) {
        const nn = rnd(2, 8);
        o = opts(`${nn} 个`, () => `1 个`, () => `2 个`, () => `无穷多个`);
        q = `方程 z^${nn} = 1（${nn} 为正整数）在复数范围内的根有？`;
        exp = `单位圆上的 ${nn} 次单位根共 ${nn} 个：e^{2πik/${nn}}（k=0,…,${nn}-1）。`;
      } else if (type === 3) {
        const p = [2, 4, 6, 8][rnd(0, 3)];
        const val = pow1i(p);
        o = opts(val, () => p === 2 ? "-2i" : "4", () => "0", () => `${p}`);
        q = `(1+i)^${p} = ？`;
        exp = `1+i = √2·e^{iπ/4}，故 (1+i)^${p} = 2^{${p}/2}·e^{i${p}π/4} = ${val}。`;
      } else if (type === 4) {
        const th = rnd(15, 75);
        o = opts(`cos ${th}° − i·sin ${th}°`, () => `cos ${th}° + i·sin ${th}°`, () => `−cos ${th}° + i·sin ${th}°`, () => `1/(cos ${th}° + i·sin ${th}°)`);
        q = `(cos ${th}° + i·sin ${th}°)^{−1} = ？`;
        exp = `由棣莫弗：(cosθ+i sinθ)^{−1} = cos(−θ)+i sin(−θ) = cosθ − i sinθ。`;
      } else if (type === 5) {
        const m = rnd(2, 5);
        o = opts(`cos(${m}θ) − i·sin(${m}θ)`, () => `cos(${m}θ) + i·sin(${m}θ)`, () => `−cos(${m}θ) + i·sin(${m}θ)`, () => `${m}(cos θ − i·sin θ)`);
        q = `(cos θ + i·sin θ)^{−${m}} = ？`;
        exp = `负幂：= cos(−${m}θ)+i sin(−${m}θ) = cos(${m}θ) − i·sin(${m}θ)。`;
      } else if (type === 6) {
        const th = rnd(20, 70);
        o = opts("cos²θ − sin²θ", () => "2·sinθ·cosθ", () => "cos²θ + sin²θ", () => "1 − 2sin²θ");
        q = `由棣莫弗，(cos ${th}° + i·sin ${th}°)² 的实部（即 cos 2${th}°）等于？`;
        exp = `(cosθ+i sinθ)² = cos2θ + i sin2θ = cos²θ−sin²θ + i·2sinθcosθ，实部 = cos²θ−sin²θ。`;
      } else if (type === 7) {
        const nn = rnd(2, 8);
        o = opts("0", () => "1", () => `${nn}`, () => "−1");
        q = `方程 z^${nn} = 1 的全部 ${nn} 个根（单位根）之和 = ？`;
        exp = `单位根 e^{2πik/${nn}}（k=0..${nn}-1）是等比数列求和，和为 0。`;
      } else if (type === 8) {

        q = `由棣莫弗，(cos ${th}° + i·sin ${th}°)² 的虚部（即 sin 2${th}°）等于？`;
        exp = `展开虚部 = 2sinθcosθ，即 sin2θ。`;

      results.push(Q(q, o, type === 2 ? "基础" : "进阶", exp, "棣莫弗定理"));

        o = opts("π", () => `${Math.PI / 2}`, () => `2π`, () => `${a}π`);
        q = `反常积分 ∫_{−∞}^∞ ${a}/(${a * a}+x²) dx = ？`;
        exp = `[arctan(x/${a})]_{−∞}^∞ = π/2 − (−π/2) = π。`;
      } else if (type === 6) {
        const a = rnd(2, 15);
        o = opts("发散", () => `收敛到 1`, () => `收敛到 0`, () => `收敛到 ln${a}`);
        q = `反常积分 ∫₀^${a} 1/x dx 的敛散性？`;
        exp = `[ln x]₀^${a} = ∞，在 0 处发散。`;
      } else if (type === 7) {
        const a = rnd(2, 15);
        const v = (1 / Math.log(a)).toFixed(3);
        o = opts(`${v}`, () => `∞`, () => `${Math.log(a).toFixed(3)}`, () => `1`);
        q = `反常积分 ∫${a}^∞ 1/[x(ln x)²] dx 收敛到？`;
        exp = `令 u=ln x：∫_{ln ${a}}^∞ u^{−2} du = [−1/u] = 1/ln ${a} ≈ ${v}。`;
      } else if (type === 8) {
        const p = rnd(2, 6);
        const v = (1 / ((p - 1) * Math.pow(2, p - 1))).toFixed(3);
        o = opts(`${v}`, () => `∞`, () => `0`, () => `1`);
        q = `反常积分 ∫₂^∞ 1/x^${p} dx = ？`;
        exp = `[−1/(${p - 1})x^{${p - 1}}]₂^∞ = 1/(${p - 1})·2^{−${p - 1}} = ${v}。`;
      } else {
        const k = rnd(1, 5);
        const v = (1 / k).toFixed(3);
        o = opts(`${v}`, () => `1`, () => `0`, () => `∞`);
        q = `反常积分 ∫₀^∞ e^(−${k}x) dx = ？`;
        exp = `[−e^(−${k}x)/${k}]₀^∞ = 1/${k} = ${v}。`;
      }
      results.push(Q(q, o, "进阶", exp, "反常积分"));
    }
    return results;
  }

  /* ============================================================
   * 拓展 · 多元函数偏导（大学预科）
   * ============================================================ */
  function qPartialDeriv(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const a = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * a * X * Y;
        o = opts(`${v}`, () => `${a * X * Y}`, () => `${2 * a * X}`, () => `${Y}`);
        q = `f(x,y)=${a}x²y，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = 2${a}xy = 2·${a}·${X}·${Y} = ${v}。`;
      } else if (type === 1) {
        const a = rnd(1, 6), X = rnd(1, 5);
        const v = a * X * X;
        o = opts(`${v}`, () => `${2 * a * X}`, () => `${a}`, () => `${2 * a * v}`);
        q = `f(x,y)=${a}x²y，求 ∂f/∂y 在 (${X},${rnd(1, 5)}) 的值 = ？`;
        exp = `∂f/∂y = ${a}x² = ${a}·${X}² = ${v}。`;
      } else if (type === 2) {
        const a = rnd(1, 6), b = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * a * X + b * Y;
        o = opts(`${v}`, () => `${2 * a * X}`, () => `${a * X + b * Y}`, () => `${b * Y}`);
        q = `f(x,y)=${a}x²+${b}xy，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = 2${a}x+${b}y = 2·${a}·${X}+${b}·${Y} = ${v}。`;
      } else if (type === 3) {
        const nn = rnd(2, 4);
        o = opts("相等", () => "互为相反数", () => "无关", () => "相差一个常数");
        q = `若 ${nn} 元函数二阶混合偏导连续，则 ∂²f/∂x∂y 与 ∂²f/∂y∂x 的关系是？`;
        exp = `克莱罗定理：连续时混合偏导相等。`;
      } else if (type === 4) {
        const a = rnd(1, 6), b = rnd(1, 6);
        o = opts("(∂f/∂x)dx + (∂f/∂y)dy", () => "∂f/∂x + ∂f/∂y", () => "(∂f/∂x)(∂f/∂y)", () => "dx+dy");
        q = `二元函数 f(x,y)=${a}x²+${b}y² 的全微分 df = ？`;
        exp = `df = f_x dx + f_y dy = 2${a}x dx + 2${b}y dy（形式即 f_x dx + f_y dy）。`;
      } else if (type === 5) {
        const a = rnd(1, 5), X = rnd(1, 4), Y = rnd(1, 4);
        const v = (a * Y * Math.exp(a * X * Y)).toFixed(3);
        o = opts(`${v}`, () => `${(X * Math.exp(a * X * Y)).toFixed(3)}`, () => `${(Math.exp(a * X * Y)).toFixed(3)}`, () => `${(a * X * Y * Math.exp(a * X * Y)).toFixed(3)}`);
        q = `f(x,y)=e^(${a}xy)，求 ∂f/∂x 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂x = e^{${a}xy}·${a}y = ${a}·${Y}·e^{${a}·${X}·${Y}} ≈ ${v}。`;
      } else if (type === 6) {
        const a = rnd(1, 9);
        o = opts("曲面沿 x 方向切线的斜率", () => "曲面法向量", () => "体积变化率", () => "面积");
        q = `偏导数 ∂f/∂x（如 f(x,y)=x²+y²+${a}）的几何意义是？`;
        exp = `固定 y=y0，曲面截线对 x 的切线斜率。`;
      } else if (type === 7) {
        const P = rnd(1, 6), Q = rnd(1, 6);
        o = opts(`(${P},${Q})`, () => `(${Q},${P})`, () => `(0,0)`, () => `(${P + Q},${P})`);
        q = `f(x,y)=x²+y²−2${P}x−2${Q}y 的唯一驻点是？`;
        exp = `f_x=2x−2${P}=0, f_y=2y−2${Q}=0 → x=${P}, y=${Q}，驻点(${P},${Q})。`;
      } else if (type === 8) {
        const a = rnd(1, 6), b = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = 2 * b * Y + a * X;
        o = opts(`${v}`, () => `${2 * b * Y}`, () => `${a * X + b * Y}`, () => `${a * X}`);
        q = `f(x,y)=${a}xy+${b}y²，求 ∂f/∂y 在 (${X},${Y}) 的值 = ？`;
        exp = `∂f/∂y = ${a}x+2${b}y = ${a}·${X}+2·${b}·${Y} = ${v}。`;
      } else {
        const c = rnd(1, 6), d = rnd(1, 6);
        const v = (c * d).toFixed(3);
        o = opts(`${v}`, () => `${c}`, () => `${d}`, () => `${(c / d).toFixed(3)}`);
        q = `f(x,y)=${c}x·${d}y，求 ∂²f/∂x∂y = ？`;
        exp = `∂f/∂x = ${c * d}y，再对 y 求偏导 = ${c * d}。`;
      }
      results.push(Q(q, o, "进阶", exp, "多元函数偏导"));
    }
    return results;
  }

  /* ============================================================
   * 拓展 · 梯度（大学预科）
   * ============================================================ */
  function qGradient(n) {
    const results = [];
    for (let i = 0; i < n; i++) {
      const type = i % 10;
      let q, o, exp;
      if (type === 0) {
        const a = rnd(1, 6), b = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = `(${2 * a * X}, ${2 * b * Y})`;
        o = opts(`${v}`, () => `(${a * X}, ${b * Y})`, () => `(${2 * a}, ${2 * b})`, () => `(${2 * a * X + 2 * b * Y})`);
        q = `f(x,y)=${a}x²+${b}y² 的梯度 ∇f 在 (${X},${Y}) = ？`;
        exp = `∇f = (2${a}x, 2${b}y)，在 (${X},${Y}) 为 (${2 * a * X}, ${2 * b * Y})。`;
      } else if (type === 1) {
        const a = rnd(1, 9);
        o = opts("函数值增加最快的方向", () => "减小最快的方向", () => "等高线切线方向", () => "任意方向");
        q = `对 f(x,y)=x²+y²+${a}，梯度 ∇f 的方向是？`;
        exp = `梯度方向是函数值增长最快的方向。`;
      } else if (type === 2) {
        const a = rnd(1, 9);
        o = opts("最大方向导数", () => "函数值", () => "零", () => "偏导数之和");
        q = `对 f(x,y)=${a}x+${a}y，梯度的模 |∇f| 等于？`;
        exp = `|∇f| 等于该点方向导数的最大值。`;
      } else if (type === 3) {
        const a = rnd(1, 9);
        o = opts("垂直（法向）", () => "平行", () => "相切", () => "无关");
        q = `对 f(x,y)=x²+${a}y，在一点处 ∇f 与过该点的等高线的关系是？`;
        exp = `梯度垂直于等高线，指向函数增大方向（法向）。`;
      } else if (type === 4) {
        const a = rnd(1, 9);
        o = opts("∇f · u", () => "|∇f|", () => "∇f × u", () => "∂f/∂x");
        q = `沿单位向量 u 的方向导数 D_u f（如 f(x,y)=x²+${a}y）等于？`;
        exp = `D_u f = ∇f · u = |∇f|cosφ。`;
      } else if (type === 5) {
        const c = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const v = `(${c * Y}, ${c * X})`;
        o = opts(`${v}`, () => `(${c * X}, ${c * Y})`, () => `(${c}, ${c})`, () => `(${X}, ${Y})`);
        q = `f(x,y)=${c}xy 在 (${X},${Y}) 处的梯度 = ？`;
        exp = `∇f = (${c}y, ${c}x)，在 (${X},${Y}) 为 (${c * Y}, ${c * X})，模 ${Math.sqrt(c * c * (X * X + Y * Y)).toFixed(2)}。`;
      } else if (type === 6) {
        const a = rnd(1, 9);
        o = opts("−∇f（负梯度）", () => "∇f", () => "等高线方向", () => "任意");
        q = `对 f(x,y)=${a}x²+y²，要使函数值下降最快，应沿哪个方向？`;
        exp = `最速下降方向 = 负梯度 −∇f。`;
      } else if (type === 7) {
        const p = rnd(1, 9), q2 = rnd(1, 9);
        o = opts(`(${p}, ${q2})`, () => `(${q2}, ${p})`, () => `(${p + q2}, 0)`, () => `(${p}, 0)`);
        q = `f(x,y)=${p}x+${q2}y 的梯度 ∇f = ？`;
        exp = `∇f = (∂f/∂x, ∂f/∂y) = (${p}, ${q2})。`;
      } else if (type === 8) {
        const c = rnd(1, 6), X = rnd(1, 5), Y = rnd(1, 5);
        const mod = (c * Math.sqrt(X * X + Y * Y)).toFixed(2);
        o = opts(`${mod}`, () => `${c}`, () => `${(c * X).toFixed(2)}`, () => `${(c * (X + Y)).toFixed(2)}`);
        q = `f(x,y)=${c}(x²+y²) 在 (${X},${Y}) 处梯度的模 = ？`;
        exp = `∇f = (2${c}x, 2${c}y)，模 = 2${c}√(${X}²+${Y}²) = ${mod}。`;
      } else {
        const c = rnd(1, 6);
        const dir = `(${c}, ${c})`;
        o = opts(`${dir}`, () => `(${-c}, ${-c})`, () => `(${c}, 0)`, () => `(0, ${c})`);
        q = `f(x,y)=${c}x+${c}y，使函数值增长最快的单位方向梯度的指向是？`;
        exp = `∇f = (${c}, ${c})，指向 (${c}, ${c})（增长最快方向）。`;
      }
      results.push(Q(q, o, "进阶", exp, "梯度"));
    }
    return results;
  }

  /* ============================================================
   * 注册到 window.MM_TECH
   * ============================================================ */
  const GEN = {
    euler: qEuler,
    taylor: qTaylor,
    numshape: qNumShape,
    induction: qInduction,
    amgm: qAmGm,
    binomial: qBinomial,
    inclusion_hs: qInclusion,
    recurrence: qRecurrence,
    tree: qTree,
    counting: qCounting,
    cauchy: qCauchy,
    linearprog: qLinearProg,
    matrix: qMatrix,
    lhopital: qLhopital,
    mvt: qMvt,
    bayes: qBayes,
    fullprob: qFullProb,
    normal_app: qNormalApp,
    definite_int: qDefiniteInt,
    diffeq: qDiffEq,
    ineq_scale: qIneqScale,
    seq_ineq: qSeqIneq,
    complex_geo: qComplexGeo,
    series: qSeries,
    coord_geo: qCoordGeo,
    jensen: qJensen,
    important_limit: qImpLimit,
    de_moivre: qDeMoivre,
    random_var: qRandVar,
    fourier: qFourier,
    integral_app: qIntApp,
    graph_transform: qGraphTrans,
    set: qSet,
    funcconcept: qFuncConcept,
    explog: qExpLog,
    trig: qTrig,
    sequence: qSequence,
    vector: qVector,
    solid: qSolid,
    derivative: qDerivative,
    conic: qConic,
    complex: qComplex,
    dist_exp: qDistExp,
    dist_binom: qDistBinom,
    stat_case: qStatCase,
    trig_id: qTrigId,
    seqsum: qSeqSum,
    solid_axis: qSolidAxis,
    solid_angle: qSolidAngle,
    deriv_mon: qDerivMon,
    deriv_ineq: qDerivIneq,
    func_zero: qFuncZero,
    conic_link: qConicLink,
    conic_chord: qConicChord,
    conic_prop: qConicProp,
    param_eq: qParamEq,
    polar_deep: qPolarDeep,
    param_extremum: qParamExtremum,
    vector_geo_adv: qVectorGeoAdv,
    abs_ineq: qAbsIneq,
    cauchy_app: qCauchyApp,
    rearrange_ineq: qRearrIneq,
    markov: qMarkov,
    lln: qLLN,
    confidence: qConfidence,
    hypothesis: qHypothesis,
    improper_int: qImproperInt,
    partial_deriv: qPartialDeriv,
    gradient: qGradient
  };

  if (window.MM_TECH) {
    window.MM_TECH.forEach(t => {
      if (GEN[t.id]) t.qgen = GEN[t.id];
    });
  }
  window.QGEN_HIGH_READY = true;
})();

  <script>
/* ============================================================
 * 学习技巧引擎（Techniques）
 * 三类技巧贯穿全系统：
 *   1) 知识梳理  —— 章节知识卡 + 思维导图（数据驱动，可标记已梳理）
 *   2) 错题复盘  —— 练习答错自动入错题本，三问 + 错因标签
 *   3) 间隔巩固  —— Leitner 五盒调度，按 1/2/4/7/15 天节奏回看
 * 本文件只放「逻辑 + 技巧专属渲染」，页面组装在 app.js。
 * ============================================================ */
const TECH = (function () {
  const LEITNER = [1, 2, 4, 7, 15];           // 各盒间隔（天）
  const DAY = 24 * 3600 * 1000;

  /* ---------- 错因标签 ---------- */
  const MISTAKE_TAGS = [
    { id: "concept", label: "概念不清" },
    { id: "calc", label: "计算失误" },
    { id: "read", label: "审题偏差" },
    { id: "idea", label: "思路错误" }
  ];

  /* ---------- 间隔巩固调度 ---------- */
  function mkReview() {
    const now = Date.now();
    return { box: 1, due: now, last: now, history: [], done: false };
  }
  function ensureReview(key) {
    if (!state.review[key]) state.review[key] = mkReview();
  }
  function promote(key, ok) {
    const r = state.review[key];
    if (!r) return;
    r.last = Date.now();
    r.box = ok ? Math.min(5, r.box + 1) : 1;
    r.history.push({ ok, t: r.last });
    const iv = LEITNER[Math.min(r.box, 5) - 1] || 15;
    r.due = r.last + iv * DAY;
    if (r.box >= 5) r.done = true;
    // 错题满盒即毕业
    if (r.done && key.indexOf("m:") === 0) {
      const m = state.mistakes.find(x => x.id === key.slice(2));
      if (m) m.resolved = true;
    }
    save();
  }

  /* 今日到期待复习条目（错题 + 知识卡） */
  function dueItems() {
    const now = Date.now();
    const out = [];
    for (const key in state.review) {
      const r = state.review[key];
      if (r.done || r.due > now) continue;
      if (key.indexOf("m:") === 0) {
        const m = state.mistakes.find(x => x.id === key.slice(2) && !x.resolved);
        if (m) out.push({ key, kind: "mistake", box: r.box, payload: m });
      } else if (key.indexOf("k:") === 0) {
        const ch = CHAPTERS.find(c => c.id === key.slice(2));
        if (ch) out.push({ key, kind: "knowledge", box: r.box, payload: ch });
      }
    }
    return out.sort((a, b) => a.box - b.box);
  }

  function reviewStats() {
    let total = 0, due = 0, done = 0;
    const now = Date.now();
    for (const k in state.review) {
      const r = state.review[k];
      total++;
      if (r.done) done++; else if (r.due <= now) due++;
    }
    return { total, due, done };
  }

  /* ---------- 错题捕获（练习答错时调用） ---------- */
  function captureMistake(rec) {
    // rec: {chId, qKey, q, options, ans, myAns, explain, fig}
    const id = rec.chId + "#" + rec.qKey;
    let m = state.mistakes.find(x => x.id === id && !x.resolved);
    if (m) {
      m.myAns = rec.myAns; m.created = Date.now();
    } else {
      m = Object.assign({ id, resolved: false, reason: "", tags: [], created: Date.now() }, rec);
      state.mistakes.push(m);
    }
    ensureReview("m:" + id);
    save();
    return m;
  }

  /* ---------- 知识梳理：思维导图（SVG） ---------- */
  function buildMindmap(ch) {
    const items = ch.knowledge || [];
    if (!items.length) return "";
    const W = 680, H = 240, cx = W / 2, cy = 40;
    let s = `<svg viewBox="0 0 ${W} ${H}" class="mindmap">`;
    s += `<rect width="${W}" height="${H}" fill="#fbfdff"/>`;
    // 中心节点（章标题）
    s += `<rect x="${cx - 70}" y="${cy - 16}" width="140" height="32" rx="16" fill="#2f6fed"/>`;
    s += `<text x="${cx}" y="${cy + 5}" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">${esc(ch.title)}</text>`;
    // 子节点环绕下半区
    const n = items.length;
    items.forEach((it, i) => {
      const ang = Math.PI + (Math.PI * (i + 0.5) / n); // 下半弧
      const r = 150;
      const x = cx + r * Math.cos(ang);
      const y = cy + 30 + 120 * (i % 2 === 0 ? 0.4 : 0.95);
      const bx = x < cx ? x - 64 : x - 64;
      s += `<line x1="${cx}" y1="${cy + 16}" x2="${x}" y2="${y - 12}" stroke="#9bb4e8" stroke-width="1.5"/>`;
      s += `<rect x="${bx}" y="${y - 14}" width="128" height="28" rx="8" fill="#eaf1ff" stroke="#2f6fed" stroke-width="1"/>`;
      s += `<text x="${bx + 64}" y="${y + 5}" font-size="12" fill="#1a3a5f" text-anchor="middle">${esc(it.term)}</text>`;
    });
    s += `</svg>`;
    return s;
  }

  return { LEITNER, MISTAKE_TAGS, ensureReview, promote, dueItems, reviewStats, captureMistake, buildMindmap };
})();

/* ============================================================
 * 融入层（Integration）
 * 把上次 math-mastery 的全部学习技巧挂到本次「人教版章节主线」：
 *   - 127 解题方法库（window.MM_TECH）
 *   - 动图引擎（window.Anim，19 类交互演示）
 *   - 参数化出题（t.qgen，122 个方法支持每轮不重样）
 * 通过「章节→方法」映射，使每个章节都能按主线扩展出对应的解题技巧、
 * 动态演示与随机题库；并提供本章视角的 AI 诊断。
 * 本层只做“桥接 + 适配 + 渲染”，不重复定义数据。
 * ============================================================ */
(function () {
  /* ---------- 年级归一化：pep 章节 grade → MM_TECH grade ---------- */
  function normGrade(g) {
    const same = ["一年级", "二年级", "三年级", "四年级", "五年级", "六年级", "七年级", "八年级", "九年级"];
    if (same.indexOf(g) >= 0) return g;
    if (g === "必修第一册" || g === "必修第二册") return "十年级";
    if (g === "选择性必修第一册") return "十一年级";
    if (g === "选择性必修第二册" || g === "选择性必修第三册") return "十二年级";
    return g;
  }

  /* ---------- 显式映射（精准对应主线章节，优先于按年级自动匹配） ---------- */
  const EXPLICIT = {
    "x1sc1": ["count", "addsub"],          // 一上·准备课 → 数数与数位 / 100以内加减法
    "c7sc1": ["rational"],                 // 七上·有理数 → 有理数与数轴
    "gb1c1": ["set"]                       // 高一·集合 → 集合与逻辑
  };

  /* ---------- 取某章适用的解题方法（MM_TECH 对象数组） ---------- */
  function chapterTechs(ch) {
    if (!ch) return [];
    let ids = EXPLICIT[ch.id];
    if (!ids) {
      const ng = normGrade(ch.grade);
      ids = (window.MM_TECH || []).filter(t => t.grade === ng).map(t => t.id).slice(0, 6);
    }
    return ids.map(id => (window.MM_TECH || []).find(t => t.id === id)).filter(Boolean);
  }

  /* ---------- 参数化出题适配：生成题({q,opts,ans,explain,fig}) → pep 格式 ---------- */
  function pepFromGen(g, key) {
    return {
      q: g.q, options: g.opts, ans: g.ans,
      explain: g.explain || "", fig: g.fig || null,
      key: key, level: g.level, gen: true
    };
  }

  /* ---------- 取某章的练习题库 ----------
   * 优先用映射方法的 qgen 参数化生成（每轮不重样）；
   * 无参数化方法时回退到章内固定题。 */
  function chapterPracticeItems(ch, n) {
    n = n || 8;
    const techs = chapterTechs(ch).filter(t => typeof t.qgen === "function");
    const out = [];
    if (techs.length) {
      let i = 0;
      while (out.length < n && i < techs.length * 6) {
        const t = techs[i % techs.length];
        const g = t.qgen(1)[0];
        out.push(pepFromGen(g, t.id + "#" + out.length));
        i++;
      }
    }
    if (out.length < n && ch.questions && ch.questions.length) {
      ch.questions.forEach((q, idx) => {
        if (out.length >= n) return;
        out.push(q.gen ? q.gen() : {
          q: q.q, options: q.options, ans: q.ans,
          explain: q.explain, fig: q.fig, key: q.key
        });
      });
    }
    return out.slice(0, n);
  }

  /* ---------- 渲染单个解题方法卡 ---------- */
  // 富文本转义：先整体转义，再放行 <b></b>（原库步骤里的加粗标记）
  function escB(s) {
    return esc(s).replace(/&lt;\/?b&gt;/g, m => m.replace("&lt;", "<").replace("&gt;", ">"));
  }
  function renderTechCard(t) {
    if (!t) return "";
    let s = `<div class="tech-method">
      <div class="tm-head"><span class="tm-name">${esc(t.name)}</span><span class="tm-grade">${esc(t.grade || "")}</span></div>
      <div class="tm-sum">${escB(t.summary || "")}</div>`;
    if (t.steps && t.steps.length) {
      s += `<ol class="tm-steps">`;
      t.steps.forEach(st => {
        const txt = typeof st === "string" ? st : (st.text || st.t || "");
        s += `<li>${escB(txt)}</li>`;
      });
      s += `</ol>`;
    }
    // 动态演示：方法声明了 anim 且引擎存在 → 就地直接挂载（演示内部自带播放控制）
    if (t.anim && window.Anim && typeof window.Anim[t.anim] === "function") {
      s += `<div class="anim-box" data-animbox="${esc(t.anim)}"></div>`;
    } else {
      // 没配动图 → 跳转到演示库里最相关的具体演示（无相关则回退演示库）
      const ref = REF_ANIM[t.id];
      if (ref && window.Anim && typeof window.Anim[ref] === "function") {
        s += `<a class="tm-animlink" href="#/methods/anim/${esc(ref)}">🎬 看相关演示：${esc(ANIM_LABELS[ref] || ref)} →</a>`;
      } else {
        s += `<a class="tm-animlink" href="#/methods">🎬 去动图演示库看相关演示 →</a>`;
      }
    }
    s += `</div>`;
    return s;
  }

  /* ---------- 动图演示库（全部可交互 Anim 演示） ---------- */
  const ANIM_LABELS = {
    chicken: "鸡兔同笼 · 假设法(抬腿)", general: "将军饮马 · 对称点", melon: "瓜豆原理 · 轨迹",
    func: "函数图像变换", move: "动点问题", trip: "最短路径", geo: "几何变换",
    solid: "立体几何", conic: "圆锥曲线", euler: "欧拉公式", taylor: "泰勒展开",
    numshape: "数形结合", tree: "树状图", linearprog: "线性规划", normal: "正态分布",
    cgeo: "复数几何", lim: "极限", gtrans: "图形平移", definite: "定积分",
    countPoints: "数一数 · 10 个一组", placeValue: "数位 · 位值拆解", carryAdd: "进位加法 · 列竖式", borrowSub: "退位减法 · 列竖式"
  };
  /* 方法 → 演示库中最相关的具体演示（用于「看相关演示」直达跳转） */
  const REF_ANIM = {
    /* 小学 */
    multi: "placeValue", decimal: "placeValue", fourops: "carryAdd", trip: "trip",
    circle: "move", cylinder: "solid", perim: "gtrans",
    /* 初中 */
    rational: "move", linear1: "func", inequal: "linearprog", system: "func",
    segangle: "gtrans", triangle: "geo", congruent: "geo", similar: "geo", pyth: "geo",
    quad: "gtrans", circ: "move", inverse: "func", prob: "tree", funcconcept: "func",
    /* 高中 */
    explog: "func", trig: "func", trig_id: "func", sequence: "numshape", arithseq: "numshape",
    seqsum: "numshape", vector: "cgeo", derivative: "lim", deriv_mon: "lim", deriv_ineq: "lim",
    func_zero: "lim", lhopital: "lim", mvt: "func", series: "lim", lln: "lim",
    conic: "conic", conic_prop: "conic", coord_geo: "conic", complex: "cgeo", de_moivre: "cgeo",
    matrix: "gtrans", solid: "solid", vector_geo_adv: "solid", partial_deriv: "solid", gradient: "solid",
    integral_app: "definite", improper_int: "definite", param_eq: "move", polar_deep: "move",
    param_extremum: "move", binomial: "tree", counting: "tree", bayes: "tree", fullprob: "tree",
    markov: "tree", dist_binom: "normal", confidence: "normal", hypothesis: "normal"
  };
  function renderAnimGallery() {
    const names = Object.keys(ANIM_LABELS);
    let s = `<div class="anim-gallery">`;
    names.forEach(nm => {
      if (!window.Anim || typeof window.Anim[nm] !== "function") return;
      s += `<div class="anim-card" id="animcard-${esc(nm)}">
        <div class="anim-card-h">${esc(ANIM_LABELS[nm] || nm)}</div>
        <div class="anim-box" data-animbox="${nm}"></div>
      </div>`;
    });
    s += `</div>`;
    return s;
  }

  /* ---------- 挂载动图盒子（在页面渲染后调用） ---------- */
  function mountAnimBoxes(root) {
    const scope = root || document;
    scope.querySelectorAll("[data-animbox]").forEach(box => {
      if (box.dataset.mounted) return;
      const nm = box.dataset.animbox;
      if (window.Anim && typeof window.Anim[nm] === "function") {
        try { window.Anim[nm](box); box.dataset.mounted = "1"; }
        catch (e) { box.textContent = "动图加载失败"; }
      }
    });
    scope.querySelectorAll("[data-anim]").forEach(btn => {
      if (btn.dataset.bound) return;
      btn.dataset.bound = "1";
      btn.addEventListener("click", () => {
        const nm = btn.dataset.anim;
        const box = btn.parentElement.querySelector('[data-animbox="' + nm + '"]');
        if (box && window.Anim && typeof window.Anim[nm] === "function") {
          try { window.Anim[nm](box); box.dataset.mounted = "1"; } catch (e) {}
        }
      });
    });
  }

  /* ---------- AI 诊断（本章主线视角） ---------- */
  function analyzeDiagnose() {
    const now = Date.now();
    const byCh = {};
    state.mistakes.filter(m => !m.resolved).forEach(m => {
      if (!byCh[m.chId]) byCh[m.chId] = { count: 0, last: m.created || now };
      byCh[m.chId].count++;
      if (m.created) byCh[m.chId].last = Math.max(byCh[m.chId].last, m.created);
    });
    const weakChapters = Object.keys(byCh).map(chId => {
      const ch = chapterById(chId);
      const w = byCh[chId];
      const days = (now - w.last) / 86400000;
      const sev = Math.min(10, w.count * 2 + (days > 7 ? 2 : 0) + (days > 30 ? 3 : 0));
      const techs = ch ? chapterTechs(ch) : [];
      return { chId, ch, count: w.count, sev, techs };
    }).sort((a, b) => b.sev - a.sev);

    const rs = TECH.reviewStats();
    const total = CHAPTERS.length;
    const mastered = CHAPTERS.filter(c => isMastered(c.id)).length;
    const pct = total ? Math.round(mastered / total * 100) : 0;
    return { now, byCh, weakChapters, due: rs.due, total, mastered, pct };
  }

  /* ---------- 生成专属训练套餐（结合映射方法的 qgen） ---------- */
  function genPlanItems(r) {
    const items = [];
    r.weakChapters.slice(0, 6).forEach(x => {
      const ch = x.ch; if (!ch) return;
      const techs = x.techs.filter(t => typeof t.qgen === "function");
      if (techs.length) {
        techs.slice(0, 2).forEach(t => {
          const g = t.qgen(1)[0];
          items.push(pepFromGen(g, t.id + "#plan" + items.length));
        });
      } else if (ch.questions && ch.questions.length) {
        const q = ch.questions[Math.floor(Math.random() * ch.questions.length)];
        items.push(q.gen ? q.gen() : {
          q: q.q, options: q.options, ans: q.ans,
          explain: q.explain, fig: q.fig, key: q.key
        });
      }
    });
    return items;
  }

  /* ---------- 小学低年级方法挂接专属动图 ---------- */
  if (window.MM_TECH && Array.isArray(window.MM_TECH)) {

    window.MM_TECH.forEach(t => {
      if (!t.anim && MAP[t.id] && typeof window.Anim[MAP[t.id]] === "function") t.anim = MAP[t.id];
    });
  }

  window.Integ = {
    normGrade, chapterTechs, chapterPracticeItems,
    renderTechCard, renderAnimGallery, mountAnimBoxes,
    analyzeDiagnose, genPlanItems
  };
})();

  <!-- 奥数题库（原创同题型，按教材 240 个专题组织，供 #/oly 使用） -->
  <script>
/* ============================================================
 * 奥数题库（原创同题型）—— 按 1–6 年级组织
 * 定位：与「举一反三」等奥数教辅**同题型、同专题**，
 *      但全部题目由本文件原创的参数化生成器现场生成，不复制任何原书题目，
 *      因此可安全地放进本开源项目。
 * 结构：年级 → 专题 → 生成器 gen() → { q, options, ans, explain, point }
 *      生成的题与 qgen 引擎同构，可直接复用练习/错题/复习/打印闭环。
 * 说明：题目难度按年级递进（数图形→和差倍→盈亏行程→数论综合）。
 * ============================================================ */
(function () {
  /* ---------- 小工具 ---------- */
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function divisors(n) { const d = []; for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i); return d; }
  function h32(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; } return (h >>> 0).toString(36); }

  /* 由正确答案构造互异选项（全部转字符串，避免数字/字符串重复） */
  function opts(ans, make, n) {
    n = n || 4;
    const A = String(ans), set = [A];
    let g = 0;
    while (set.length < n && g++ < 400) { const s = String(make()); if (set.indexOf(s) < 0) set.push(s); }
    if (typeof ans === "number") {
      let k = 1;
      while (set.length < n) {
        const up = String(ans + k), dn = String(ans - k);
        if (set.indexOf(up) < 0) set.push(up);
        if (set.length < n && set.indexOf(dn) < 0) set.push(dn);
        k++;
      }
    } else {
      let k = 1;
      while (set.length < n) { const s = String(ans) + "（" + k + "）"; if (set.indexOf(s) < 0) set.push(s); k++; }
    }
    const arr = shuffle(set);
    return { options: arr, ans: arr.indexOf(A) };
  }
  function Q(q, ans, make, explain, point, level) {
    const o = opts(ans, make);
    return { q, options: o.options, ans: o.ans, explain, point: point || "", level: level || "奥数", fig: null };
  }

  /* ============================================================
   * 一年级
   * ============================================================ */
  const G1 = [
    { id: "count_shape", name: "数图形", desc: "按顺序数出指定图形的个数", gen: function () {
      const syms = ["○", "△", "□", "◇"]; const seq = []; const n = rnd(8, 14);
      for (let i = 0; i < n; i++) seq.push(pick(syms));
      const target = pick(syms); const c = seq.filter(s => s === target).length;
      return Q(`数一数，下面一排图形里 ${target} 有几个？ ${seq.join(" ")}`, c, () => rnd(1, n), `按从左到右的顺序数出 ${target}：一共有 ${c} 个。`, "数图形");
    } },
    { id: "compare", name: "比多比少", desc: "多几少几，一步加减解决", gen: function () {
      const a = rnd(3, 12), d = rnd(1, 5);
      if (Math.random() < 0.5) { const b = a + d; return Q(`小明有 ${a} 个苹果，小红比小明多 ${d} 个。小红有多少个？`, b, () => rnd(2, a + d + 5), `小红 = 小明 + 多出的 = ${a} + ${d} = ${b} 个。`, "比多比少"); }
      const b = a + d; return Q(`小红有 ${b} 个苹果，小明比小红少 ${d} 个。小明有多少个？`, a, () => rnd(1, b + 3), `小明 = 小红 − 少的 = ${b} − ${d} = ${a} 个。`, "比多比少");
    } },
    { id: "pattern", name: "找规律", desc: "按固定增减规律填下一个数", gen: function () {
      const s = rnd(1, 6), d = rnd(2, 5), arr = [];
      for (let i = 0; i < 5; i++) arr.push(s + i * d);
      return Q(`找规律填数：${arr.slice(0, 4).join("、")}、（　）`, arr[4], () => arr[4] + rnd(-3, 6), `每次都增加 ${d}，所以下一项 = ${arr[3]} + ${d} = ${arr[4]}。`, "找规律");
    } },
    { id: "odd_even", name: "单数与双数", desc: "区分单双数并数个数", gen: function () {
      const n = rnd(10, 30), odd = Math.ceil(n / 2), even = Math.floor(n / 2), askOdd = Math.random() < 0.5;
      return Q(`1 到 ${n} 这些数里，${askOdd ? "单数" : "双数"}一共有多少个？`, askOdd ? odd : even, () => rnd(1, n), `1~${n} 中单数有 ${odd} 个、双数有 ${even} 个。`, "单双数");
    } },
    { id: "queue", name: "排队问题", desc: "从前数、从后数求位置", gen: function () {
      if (Math.random() < 0.5) {
        const a = rnd(2, 8), b = rnd(2, 8), ans = a + b - 1;
        return Q(`小朋友排队，小明从前数第 ${a} 个，从后数第 ${b} 个。这一排一共有几人？`, ans, () => rnd(2, a + b + 3), `总人数 = 从前数 + 从后数 − 1 = ${a} + ${b} − 1 = ${ans} 人（小明被数了两次，要减 1）。`, "排队问题");
      }
      const n = rnd(6, 15), a = rnd(2, n - 1), ans = n - a + 1;
      return Q(`一共 ${n} 个小朋友排成一排，小华从前数第 ${a} 个。小华从后数是第几个？`, ans, () => rnd(1, n), `从后数 = 总人数 − 从前数 + 1 = ${n} − ${a} + 1 = ${ans}。`, "排队问题");
    } },
    { id: "make_ten", name: "凑十法", desc: "把加数凑成 10 再相加", gen: function () {
      const a = rnd(6, 9), b = rnd(4, 9), ans = a + b, need = 10 - a;
      return Q(`算一算，用凑十法：${a} + ${b} = ？`, ans, () => rnd(a, a + b + 3), `先凑十：${a} + ${need} = 10，还剩 ${b - need}；10 + ${b - need} = ${ans}。`, "凑十法");
    } },
    { id: "avg_share", name: "平均分", desc: "把总数平均分给几份", gen: function () {
      const per = rnd(2, 5), n = rnd(2, 6), total = per * n;
      return Q(`把 ${total} 个桃子平均分给 ${n} 只小猴，每只分到几个？`, per, () => rnd(1, total), `${total} ÷ ${n} = ${per} 个。`, "平均分");
    } }
  ];

  /* ============================================================
   * 二年级
   * ============================================================ */
  const G2 = [
    { id: "pattern2", name: "找规律进阶", desc: "等差、等比、加减交替", gen: function () {
      const type = rnd(0, 2);
      if (type === 0) { const s = rnd(2, 9), d = rnd(2, 9), a = []; for (let i = 0; i < 5; i++) a.push(s + i * d); return Q(`找规律填数：${a.slice(0, 4).join("、")}、（　）`, a[4], () => a[4] + rnd(-4, 8), `每次加 ${d}，下一项 = ${a[3]} + ${d} = ${a[4]}。`, "找规律"); }
      if (type === 1) { const s = rnd(2, 4), r = rnd(2, 3), a = []; let v = s; for (let i = 0; i < 5; i++) { a.push(v); v *= r; } return Q(`找规律填数：${a.slice(0, 4).join("、")}、（　）`, a[4], () => a[4] + rnd(-6, 10), `每次乘 ${r}，下一项 = ${a[3]} × ${r} = ${a[4]}。`, "找规律"); }
      const s = rnd(6, 12), p = rnd(2, 5), m = rnd(1, 3), a = [s];
      for (let i = 1; i < 5; i++) a.push(i % 2 === 1 ? a[i - 1] + p : a[i - 1] - m);
      return Q(`找规律填数：${a.slice(0, 4).join("、")}、（　）`, a[4], () => a[4] + rnd(-4, 6), `规律是「加 ${p}、减 ${m}」交替，下一项 = ${a[3]} ${a[4] > a[3] ? "+ " + p : "− " + m} = ${a[4]}。`, "找规律");
    } },

  const GRADES = ["一年级", "二年级", "三年级", "四年级", "五年级", "六年级"];

  /* 依据教材专题骨架（OLY_SYLLABUS）+ 引擎映射（MAP）构造某年级的专题列表
   * 返回项：{ week, id, name, page, engine, desc, hasGen } */
  function topicsOf(grade) {
    const syl = (window.OLY_SYLLABUS || {})[grade] || [];
    const map = MAP[grade] || {};
    return syl.map(function (it) {
      const eid = map[it.w] || null;
      const e = (eid && eid !== "__mixed__") ? ENG[eid] : null;
      return {
        week: it.w,
        id: "g" + keyOf(grade) + "w" + it.w,
        name: it.t,
        page: it.p,
        engine: eid,
        desc: e ? e.desc : (eid === "__mixed__" ? "本年级专题综合练习" : ""),
        hasGen: !!e
      };
    });
  }
  function topicById(grade, id) {
    const m = /^g\d+w(\d+)$/.exec(id || "");
    if (!m) return null;
    const w = parseInt(m[1], 10);
    return topicsOf(grade).find(function (t) { return t.week === w; }) || null;
  }
  function keyOf(grade) { const i = GRADES.indexOf(grade); return i >= 0 ? String(i + 1) : "1"; }
  function gradeByKey(k) { const i = parseInt(k, 10); return (i >= 1 && i <= GRADES.length) ? GRADES[i - 1] : ""; }
  function totalTopics() { let n = 0; GRADES.forEach(g => { n += topicsOf(g).length; }); return n; }

  /* 由题型引擎 + 所属教材专题生成一道题，挂上专题信息与指纹 */
  function genOne(engine, topic) {
    const it = engine.gen();
    it.topicId = topic.id; it.topicName = topic.name; it.week = topic.week;
    it.engine = engine.id;
    it.fp = topic.id + "#" + h32(it.q);
    return it;
  }

  /* 生成一组题（去重，保证每遍不重样）
   * grade: 年级；topicId: 指定专题（为空或综合练习则整年级混合）；n: 题数 */
  function makeItems(grade, topicId, n) {
    n = n || 8;
    const all = topicsOf(grade);
    const real = all.filter(function (t) { return t.engine && t.engine !== "__mixed__" && ENG[t.engine]; });
    let engines = null, fixedTopic = null;
    if (topicId) {
      const t = all.find(function (x) { return x.id === topicId; });
      if (t && t.engine && t.engine !== "__mixed__" && ENG[t.engine]) { engines = [ENG[t.engine]]; fixedTopic = t; }
    }
    if (!engines) {
      if (!real.length) return [];
      engines = [];
      real.forEach(function (t) { const e = ENG[t.engine]; if (engines.indexOf(e) < 0) engines.push(e); });
    }
    const pickTopicOf = function (e) {
      if (fixedTopic) return fixedTopic;
      const cand = real.filter(function (x) { return ENG[x.engine] === e; });
      return cand.length ? pick(cand) : real[0];
    };
    const out = [], seen = {};
    let guard = 0;
    while (out.length < n && guard < n * 60) {
      const e = pick(engines); guard++;
      const it = genOne(e, pickTopicOf(e));
      if (seen[it.fp]) continue;
      seen[it.fp] = 1; out.push(it);
    }
    let k = 0;
    while (out.length < n && k++ < n * 20) out.push(genOne(pick(engines), pickTopicOf(pick(engines))));
    return out;
  }

  /* 合成章：让奥数题也能在错题本里正常显示 / 被定位
   * id 形如 "oly:<年级号>:<专题id>"，专题 "__all__" 表示整年级综合练习 */
  function chapterById(id) {
    const m = /^oly:(\d+):(.+)$/.exec(id || "");

  };
})();
