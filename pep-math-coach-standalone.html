<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>人教版数学 · 章节同步教练</title>
  <style>
/* 人教版数学 · 章节同步教练 —— 样式（浅色、紧凑、移动端友好） */
:root{
  --blue:#2f6fed; --blue-d:#1a3a5f; --ok:#2e9e5b; --no:#e0533d;
  --bg:#f3f6fc; --card:#fff; --line:#e3e9f3; --txt:#1f2937; --mut:#6b7787;
  --shadow:0 1px 3px rgba(31,41,55,.08),0 4px 14px rgba(31,41,55,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
a{color:var(--blue);text-decoration:none}
img,svg{max-width:100%}
/* 全局安全网：禁止横向溢出，清理移动端点击高亮，长文本可断行 */
html,body{overflow-x:hidden}
a,button,input,textarea,label,.opt,.tag,.nav-link{-webkit-tap-highlight-color:transparent}
.q-text,.pq-q,.mk-q,.sc-q,.tech-method,.know-def,.meth-desc,.meth-steps,.tm-steps,.oly-topic-d{overflow-wrap:anywhere;word-break:break-word}
.ch-grid,.oly-grid,.tech-list,.anim-gallery,.know-cards,.opts,.row{grid-auto-flow:row}

/* 顶栏 */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
.brand-title{font-weight:700;font-size:15px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--mut)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav-link{position:relative;padding:7px 11px;border-radius:9px;color:var(--mut);font-size:13.5px;font-weight:600}
.nav-link:hover{background:#eef3fc;color:var(--blue)}
.nav-link.active{background:var(--blue);color:#fff}
.badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;
  background:var(--no);color:#fff;font-size:11px;line-height:17px;text-align:center;display:none}
.badge.show{display:block}

.view{max-width:880px;margin:0 auto;padding:16px 14px 70px}

/* 通用 */
.back{display:inline-block;margin-bottom:10px;color:var(--mut);font-size:13px}
.btn{display:inline-block;padding:9px 16px;border-radius:10px;border:1px solid transparent;
  font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-ok{background:var(--ok);color:#fff}
.btn-ghost{background:#fff;color:var(--blue);border-color:var(--line)}
.hint{color:var(--mut);font-size:13px;background:#eef3fc;padding:8px 12px;border-radius:9px;margin:10px 0}
.chip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:#eef3fc;color:var(--mut);margin:2px}
.chip-ok{background:#e3f6ec;color:var(--ok)}
.chip-k{background:#e8efff;color:var(--blue)}
.chip-m{background:#fdeae6;color:var(--no)}

/* 学段标签 */
.stage-tabs{display:flex;gap:8px}
.stage-tab{padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--mut)}
.stage-tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.stage-desc{color:var(--mut);font-size:13px;margin:10px 0 4px}

/* 章节树 */
.grade-block{margin-top:18px}
.grade-h{font-size:17px;margin:6px 0;border-left:4px solid var(--blue);padding-left:9px}
.vol-h{font-size:12.5px;color:var(--mut);margin:8px 0 4px}
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.ch-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:block}
.ch-card:hover{transform:translateY(-1px);border-color:var(--blue)}
.ch-card.locked{opacity:.62;background:#fafbfd}
.ch-no{font-size:11.5px;color:var(--mut)}
.ch-title{font-weight:700;font-size:14.5px;margin:2px 0 6px}
.ch-badges{display:flex;flex-wrap:wrap;gap:3px}

/* 面板 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:14px;box-shadow:var(--shadow)}
.panel-h{font-size:16px;margin:0 0 10px}
.learn-head{background:linear-gradient(120deg,#2f6fed,#5b8def);color:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.lh-meta{font-size:12.5px;opacity:.9}
.lh-title{margin:4px 0;font-size:21px}
.lh-sum{margin:0;font-size:13.5px;opacity:.95}

/* 方法 */
.meth-list{display:grid;grid-template-columns:1fr;gap:10px}
.meth{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#fbfdff}
.meth-name{font-weight:700;color:var(--blue-d);font-size:15px}
.meth-desc{color:var(--mut);font-size:13px;margin:3px 0 6px}
.meth-steps{margin:0;padding-left:20px;font-size:13px}
.meth-steps li{margin:3px 0}
.meth-steps b{color:var(--blue-d)}

/* 知识卡 / 思维导图 */
.know-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px;margin:10px 0}
.know{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fbfdff}
.know-term{font-weight:700;color:var(--blue-d)}
.know-def{font-size:13px;margin:3px 0}
.know-tip{font-size:12px;color:var(--ok);background:#eefaf2;padding:3px 7px;border-radius:7px}
.mindmap{width:100%;margin:6px 0 10px;border:1px solid var(--line);border-radius:10px}
.fig{width:100%;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}

/* 题目 / 选项 */
.q-preview{margin:8px 0}
.q-item{padding:7px 10px;border:1px dashed var(--line);border-radius:9px;margin:6px 0;font-size:14px}
.q-idx{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--blue);color:#fff;border-radius:50%;font-size:12px;margin-right:6px}
.q-text{font-size:16px;font-weight:600;margin:10px 0}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt-right{background:#e3f6ec;border-color:var(--ok);color:var(--ok);font-weight:700}
.opt-wrong{background:#fdeae6;border-color:var(--no);color:var(--no);font-weight:700}
.prac-head{font-size:13px;color:var(--mut);font-weight:600}
.prac-fb,.rev-fb{margin:10px 0;font-size:14px}
.fb-ok{color:var(--ok);font-weight:700}
.fb-no{color:var(--no);font-weight:700}
.fb-exp{color:var(--mut);font-size:13px;margin-top:4px}
.learn-actions,.summary-actions,.prac-nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* 错题 / 复习 */
.page-h{font-size:20px;margin:4px 0 12px}
.mistake{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:11px 0;background:#fff;box-shadow:var(--shadow)}
.mk-head{font-size:12.5px;color:var(--mut);font-weight:700}
.mk-q{font-size:15px;font-weight:600;margin:5px 0}
.mk-ans{font-size:13.5px;margin:4px 0}
.mk-ans .ok{color:var(--ok)} .mk-ans .no{color:var(--no)}
.mk-exp{font-size:13px;color:var(--mut);background:#f7f9fd;padding:6px 9px;border-radius:8px}
.mk-tags{margin:8px 0}
.tag{padding:5px 11px;border:1px solid var(--line);border-radius:20px;background:#fff;cursor:pointer;font-size:13px;color:var(--mut)}
.tag.on{background:var(--no);color:#fff;border-color:var(--no)}
.mk-review{margin:6px 0}
.ta{width:100%;min-height:48px;margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;resize:vertical}
.mk-actions{display:flex;gap:8px;margin-top:6px}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.rev-item{border:1px solid var(--line);border-radius:13px;padding:13px;margin:11px 0;background:#fff;box-shadow:var(--shadow)}
.rev-tag{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:5px}
.rev-actions{display:flex;gap:8px;margin-top:8px}

/* 进度 */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:8px 0 16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.stat-n{font-size:21px;font-weight:800;color:var(--blue)}
.stat-l{font-size:12px;color:var(--mut)}
.prog-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.prog-name{width:48px;font-weight:600;font-size:13.5px}
.prog-bar{flex:1;height:10px;background:#e9eef7;border-radius:6px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--blue)}
.prog-num{font-size:13px;color:var(--mut);width:48px;text-align:right}

/* Toast */
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1f2937;color:#fff;
  padding:10px 18px;border-radius:11px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 移动端 */
@media (max-width:640px){
  /* 顶栏单行，导航改为横向滚动，避免 7 个链接折行撑高顶栏 */
  .topbar{flex-wrap:nowrap;overflow:hidden;gap:8px;padding:8px 12px}
  .brand{flex:0 0 auto;min-width:0}
  .nav{width:auto;margin-left:auto;flex:1 1 auto;min-width:0;flex-wrap:nowrap;
    overflow-x:auto;-webkit-overflow-scrolling:touch;gap:2px;padding-bottom:2px;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-link{flex:0 0 auto;white-space:nowrap;padding:6px 9px;font-size:12.5px}
  .brand-sub{display:none}
  .view{padding:12px 10px 72px}
  .ch-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  /* 奥数网格在手机上补两列断点，与章节网格观感统一 */
  .oly-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  /* 诊断页固定宽阶段名在窄屏收窄，避免挤占进度条 */
  .stage-name{width:108px}
  .stage-row{gap:8px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .lh-title{font-size:18px}
}

/* 超窄屏（≤360px）进一步收紧间距 */
@media (max-width:360px){
  .nav-link{padding:6px 7px;font-size:12px}
  .oly-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .view{padding:10px 8px 70px}
}

/* ============================================================
 * 融入层新增样式：解题技巧卡 / 动图 / 诊断
 * ============================================================ */

/* 解题方法卡（来自融会贯通技巧库） */
.tech-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tech-method{background:#fbfdff;border:1px solid #e3ebf7;border-radius:12px;padding:14px 14px 16px}
.tm-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
.tm-name{font-weight:700;color:#1a3a5f;font-size:15px}
.tm-grade{font-size:11px;color:#7c8aa0;background:#eef3ff;border-radius:6px;padding:1px 7px;white-space:nowrap}
.tm-sum{font-size:13px;color:#475569;line-height:1.6;margin-bottom:8px}
.tm-steps{margin:0;padding-left:20px;font-size:12.5px;color:#334155;line-height:1.7}
.tm-steps li{margin:2px 0}
.tm-anim{margin-top:10px;font-size:12.5px}
.tm-animlink{display:inline-block;margin-top:10px;font-size:12.5px;color:#1677ff;text-decoration:none}
.tm-animlink:hover{text-decoration:underline}
/* 「看相关演示」跳入时目标演示卡高亮 */
.anim-flash{outline:2px solid #1677ff;border-radius:10px;animation:animflash 1.8s ease 1}
@keyframes animflash{0%{background:rgba(22,119,255,.16)}100%{background:transparent}}

/* 动图盒子 / 画廊 */
.anim-box{margin-top:10px;border:1px solid #e6edf7;border-radius:10px;background:#fff;padding:8px;min-height:40px;overflow:auto}
.anim-box svg{display:block;max-width:100%;height:auto}
.anim-cap{font-size:12px;color:#64748b;margin:4px 2px 8px;line-height:1.5}
.anim-ctrls{margin:6px 0}
.anim-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.anim-card{border:1px solid #e3ebf7;border-radius:12px;padding:12px;background:#fff}
.anim-card-h{font-weight:600;color:#1a3a5f;font-size:14px;margin-bottom:8px}

/* 诊断页 */
.card{background:#fff;border:1px solid #e3ebf7;border-radius:14px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 10px;font-size:15px;color:#1a3a5f}
.diag-head{background:linear-gradient(135deg,#eef4ff,#f7fbff)}
.diag-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.diag-mastery{text-align:center}
.diag-mastery .n{font-size:30px;font-weight:800;color:#2f6fed;line-height:1}
.diag-mastery .l{font-size:12px;color:#7c8aa0;margin-top:4px}
.diag-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#475569}
.diag-stats b{color:#1a3a5f;font-size:16px}
.bar{height:10px;background:#e9eef6;border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:#2f6fed;border-radius:6px;transition:width .4s}
.bar.mini{height:8px;margin:0;flex:1}
.bar.mini i.warn{background:#f59e0b}
.diag-concl .muted{font-size:13.5px;line-height:1.75;color:#475569}
.stage-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
.stage-name{width:170px;flex-shrink:0;color:#1a3a5f;font-weight:600}
.stage-num{color:#7c8aa0;white-space:nowrap;font-size:12px}
.muted{color:#64748b;font-size:13px;line-height:1.7}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn.soft{background:#eef3ff;color:#2f6fed}
.warn{color:#d97706}
.empty{padding:26px;text-align:center;color:#7c8aa0;background:#f7faff;border:1px dashed #d4e0f2;border-radius:12px}

/* ============================================================
 * 返回顶部悬浮按钮
 * ============================================================ */
#toTop{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;width:46px;height:46px;border-radius:50%;
  border:1px solid #d4e0f2;background:#fff;color:var(--blue);font-size:20px;font-weight:800;line-height:1;
  cursor:pointer;box-shadow:0 6px 18px rgba(47,111,237,.22);opacity:0;visibility:hidden;
  transform:translateY(12px);transition:opacity .25s,transform .25s,visibility .25s}
/* 扫码核对页底部已有 sticky 操作栏，悬浮按钮会让其难点中，故隐藏 */
body[data-route="scan"] #toTop{display:none !important}
#toTop.show{opacity:1;visibility:visible;transform:translateY(0)}
#toTop:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
#toTop:active{transform:scale(.94)}

/* ============================================================
 * 错题卷打印
 * ============================================================ */
.print-toolbar{margin:6px 0 4px}
#printArea{display:none}
.paper{color:#111;font-size:13px;line-height:1.7}
.paper-head{text-align:center;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:14px}
.paper-title{font-size:20px;font-weight:800;letter-spacing:2px}
.paper-meta{font-size:12px;color:#555;margin-top:5px}
.paper-tip{font-size:12px;color:#444;background:#f4f6fa;border:1px solid #ddd;border-radius:6px;
  padding:6px 10px;margin:10px 0 16px}
.pq{margin:0 0 14px;page-break-inside:avoid;break-inside:avoid}
.pq-no{font-weight:700;margin-bottom:3px}
.pq-q{margin-bottom:5px}
.pq-opts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:6px}
.pq-opt{min-width:120px}
.pq-blank{border-bottom:1px dashed #bbb;height:22px;margin-top:4px}
.paper-figs svg{max-width:220px}
.qr-section{margin-top:22px;border-top:2px dashed #333;padding-top:12px;page-break-inside:avoid;break-inside:avoid}
.qr-block{margin:14px 0;display:flex;gap:16px;align-items:center;page-break-inside:avoid;break-inside:avoid}
.qr-block .qr-img{flex:0 0 auto}
.qr-block .qr-img svg,.qr-block .qr-img img{width:150px;height:150px;display:block}
.qr-img-src{image-rendering:pixelated}
.qr-block .qr-txt{font-size:12.5px;color:#222}
.qr-block .qr-txt b{font-size:14px}
@media print{
  html,body{background:#fff}
  .topbar,.nav,#toTop,#toast,.view{display:none !important}
  #printArea{display:block !important;position:static;width:100%;max-width:none;margin:0;padding:0}
  @page{margin:14mm}
}

/* ============================================================
 * 扫码复核页
 * ============================================================ */
.scan-head{background:linear-gradient(120deg,#2f6fed,#5b8def);color:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.scan-head h1{margin:0 0 4px;font-size:20px}
.scan-head p{margin:0;font-size:13px;opacity:.95}
.sc-item{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin:11px 0;background:#fff;box-shadow:var(--shadow);transition:.15s}
.sc-item.wrong{border-color:var(--no);background:#fff7f5}
.sc-item .sc-no{font-weight:700;color:var(--blue-d);margin-right:4px}
.sc-q{font-size:15px;font-weight:600;margin:5px 0}
.sc-ans{font-size:13.5px;color:var(--ok);margin:4px 0}
.sc-ans b{color:var(--ok)}
.sc-exp{font-size:12.5px;color:var(--mut);background:#f7f9fd;padding:6px 9px;border-radius:8px;margin:4px 0}
.sc-check{display:inline-flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-weight:700;color:var(--no);user-select:none}
.sc-check input{width:18px;height:18px}
.scan-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px calc(12px + env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(31,41,55,.06)}
.scan-bar .cnt{color:var(--mut);font-size:13.5px;margin-right:auto}

/* ============================================================
 * 奥数题库（按年级的专题网格）
 * ============================================================ */
.oly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:6px}
.oly-topic{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;transition:.15s}
.oly-topic:hover{transform:translateY(-1px);border-color:var(--blue)}
.oly-topic-n{font-weight:700;font-size:15px;color:var(--blue-d)}
.oly-topic-w{font-size:11px;font-weight:700;color:#7c3aed;background:#f3ecff;border-radius:20px;padding:1px 8px;align-self:flex-start;letter-spacing:.5px}
.oly-topic-d{font-size:12.5px;color:var(--mut);line-height:1.5;flex:1}
.oly-topic-go{font-size:12.5px;font-weight:700;color:var(--blue);margin-top:2px}
.oly-head{background:linear-gradient(120deg,#7c3aed,#a855f7);color:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.oly-head h1{margin:0 0 4px;font-size:20px}
.oly-head p{margin:0;font-size:13px;opacity:.95}
.oly-topic-tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:#f3ecff;color:#7c3aed;margin-left:6px;vertical-align:middle}

</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">∑</span>
      <div>
        <div class="brand-title">章节同步教练</div>
        <div class="brand-sub">人教版数学 · 主线 + 学法 + 技巧</div>
      </div>

/* ---------- 由骨架展开为章节数组 ---------- */
const CHAPTERS = [];
(function buildSkeleton() {
  for (const stage in PEP_SKELETON) {
    const grades = PEP_SKELETON[stage];
    for (const grade in grades) {
      const vols = grades[grade];
      for (const vol in vols) {
        vols[vol].forEach((title, i) => {
          const id = STAGE_CODE[stage] + GRADE_CODE[grade] + VOL_CODE[vol] + "c" + (i + 1);
          const ch = {
            id, stage, grade, vol, no: i + 1, title,
            summary: "", methods: [], knowledge: [], questions: [], built: false
          };
          if (BUILT[id]) {
            Object.assign(ch, BUILT[id]);
            ch.built = true;
          }
          CHAPTERS.push(ch);
        });
      }
    }
  }
})();

/* ---------- 合并外部知识梳理卡（js/knowledge.js） ---------- */
/* knowledge.js 在 data.js 之前加载，定义 window.PEP_KNOWLEDGE：{ 章id: {summary, knowledge} } */
(function mergeKnowledge() {
  const PK = window.PEP_KNOWLEDGE;
  if (!PK) return;
  CHAPTERS.forEach(ch => {
    const k = PK[ch.id];
    if (!k) return;
    if (k.summary) ch.summary = k.summary;
    if (k.knowledge && k.knowledge.length) {
      ch.knowledge = k.knowledge;
      ch.built = true; // 已有知识卡 + qgen 可供给练习，放开练习与「标记掌握」
    }
  });
})();

/* ---------- 学段默认学习方法（骨架章也按学段展示对应学法） ---------- */
function stageDefaultMethods(stage) {
  if (stage === "小学") return ["preview", "closeread", "mistake", "spaced"];
  if (stage === "初中") return ["preview", "closeread", "summarize", "compare", "mistake", "spaced"];
  return ["closeread", "summarize", "compare", "solve", "feynman", "mistake", "spaced"];
}
function chapterMethods(ch) {
  return (ch.methods && ch.methods.length) ? ch.methods : stageDefaultMethods(ch.stage);
}

/* 章节顺序（用于年级内顺序解锁的单一事实来源） */
const CHAPTER_ORDER = {};
CHAPTERS.forEach((c, i) => { CHAPTER_ORDER[c.id] = i; });

/* 小组键：同 学段+年级/册 视为一组，组内顺序解锁 */
function groupKey(ch) { return ch.stage + "|" + ch.grade; }

/* 小工具：随机整数（可排除 0） */
function ri(min, max, exclude) {
  let v;
  do { v = Math.floor(Math.random() * (max - min + 1)) + min; } while (v === exclude);
  return v;
}

/* ============================================================

window.Fig = {
  /* 点阵：n 个圆点，用于「数一数」 */
  dots(p) {
    const n = Math.max(1, p.n || 5);
    const cols = Math.ceil(Math.sqrt(n));
    let s = `<svg viewBox="0 0 320 160" class="fig"><rect width="320" height="160" fill="#f7faff"/>`;
    for (let i = 0; i < n; i++) {
      const r = i % cols, c = Math.floor(i / cols);
      s += `<circle cx="${40 + r * 36}" cy="${50 + c * 36}" r="13" fill="#2f6fed" opacity="0.85"/>`;
    }
    s += `</svg>`;
    return s;
  },
  /* 比多少：左△ 右○，数量由 left/right 决定 */
  compare(p) {
    const L = p.left || 3, R = p.right || 5;
    let s = `<svg viewBox="0 0 320 160" class="fig"><rect width="320" height="160" fill="#f7faff"/>`;
    s += `<text x="60" y="28" font-size="14" fill="#333" text-anchor="middle">△ 左边 ${L} 个</text>`;
    s += `<text x="260" y="28" font-size="14" fill="#333" text-anchor="middle">○ 右边 ${R} 个</text>`;
    for (let i = 0; i < L; i++) s += `<path d="M${40 + i * 28} 70 l12 20 l-24 0 z" fill="#e0533d"/>`;
    for (let i = 0; i < R; i++) s += `<circle cx="${230 + i * 22}" cy="78" r="11" fill="#2f6fed"/>`;
    s += `</svg>`;
    return s;
  },
  /* 数轴：标出 points 中的点 */
  numberLine(p) {
    const pts = (p.points || [-2]).slice();
    const min = Math.min(-3, ...pts), max = Math.max(3, ...pts);
    const W = 320, x0 = 30, span = W - 60, step = span / (max - min);
    const X = v => x0 + (v - min) * step;
    let s = `<svg viewBox="0 0 320 120" class="fig"><rect width="320" height="120" fill="#f7faff"/>`;
    s += `<line x1="${x0}" y1="60" x2="${W - 30}" y2="60" stroke="#333" stroke-width="2"/>`;
    for (let v = min; v <= max; v++) {
      const x = X(v);
      s += `<line x1="${x}" y1="54" x2="${x}" y2="66" stroke="#333" stroke-width="2"/>`;
      s += `<text x="${x}" y="84" font-size="12" fill="#333" text-anchor="middle">${v}</text>`;
    }
    s += `<text x="${W - 18}" y="56" font-size="11" fill="#888">→</text>`;
    pts.forEach(v => {
      s += `<circle cx="${X(v)}" cy="60" r="6" fill="#e0533d"/>`;

    return s;
  },
  /* 韦恩图：sets=1 单圆 / 2 双圆交；marked 为需高亮的元素编号（1..4） */
  venn(p) {
    const sets = p.sets || 1;
    const marked = p.marked || [];
    const hi = v => marked.indexOf(v) >= 0;
    const fill = v => hi(v) ? "#ffd966" : "#cfe0ff";
    let s = `<svg viewBox="0 0 320 180" class="fig"><rect width="320" height="180" fill="#f7faff"/>`;
    if (sets === 1) {
      s += `<circle cx="160" cy="90" r="60" fill="${fill(1)}" stroke="#2f6fed" stroke-width="2"/>`;
      s += `<text x="160" y="95" font-size="15" fill="#333" text-anchor="middle">A</text>`;
      s += `<text x="160" y="150" font-size="12" fill="#888" text-anchor="middle">${hi(1) ? "高亮元素 ∈ A" : "集合 A"}</text>`;
    } else {
      s += `<circle cx="125" cy="90" r="58" fill="${fill(1)}" stroke="#2f6fed" stroke-width="2"/>`;
      s += `<circle cx="195" cy="90" r="58" fill="${fill(2)}" stroke="#2f6fed" stroke-width="2"/>`;
      s += `<text x="95" y="60" font-size="14" fill="#333">A</text>`;
      s += `<text x="225" y="60" font-size="14" fill="#333">B</text>`;
      s += `<text x="160" y="95" font-size="12" fill="#333" text-anchor="middle">${hi(3) ? "∩" : ""}</text>`;
      s += `<text x="160" y="165" font-size="12" fill="#888" text-anchor="middle">${hi(2) ? "阴影= A∩B" : "A 与 B"}</text>`;
    }
    s += `</svg>`;
    return s;
  }
};
function figures(spec) {

  <script>
/* ============================================================
 * 融会贯通 · SVG 动图模块
 * 提供三种几何/算术动画：鸡兔同笼(假设法)、将军饮马(对称点)、瓜豆原理(轨迹)
 * 每个函数接收一个容器 DOM 节点，自行渲染 SVG 与交互控件。
 * ============================================================ */
window.Anim = (function () {
  const NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }

  /* ---------- 1. 鸡兔同笼：假设法(抬腿) ---------- */
  function chicken(box) {
    box.innerHTML = "";
    const H = 8, L = 22;                 // 8头22脚
    const rabbit = (L - 2 * H) / 2;      // 3
    const chickenN = H - rabbit;         // 5
    const svg = el("svg", { viewBox: "0 0 600 230" });
    const cap = document.createElement("div");
    cap.className = "anim-cap";
    cap.textContent = "点“演示”看假设法：先假设全是鸡（每头2脚），再让所有动物抬起2条腿，地上剩下的脚全是兔子的。";
    const ctrls = document.createElement("div");
    ctrls.className = "anim-ctrls";
    const btn = document.createElement("button");
    btn.className = "btn"; btn.textContent = "▶ 演示假设法";
    ctrls.appendChild(btn);

    // ground
    svg.appendChild(el("line", { x1: 20, y1: 200, x2: 580, y2: 200, stroke: "#94a3b8", "stroke-width": 2 }));
    const animals = [];
    const startX = 70, gap = 62, bodyY = 150;
    for (let i = 0; i < H; i++) {
      const cx = startX + i * gap;
      const g = el("g", {});
      // body
      g.appendChild(el("ellipse", { cx: cx, cy: bodyY, rx: 18, ry: 13, fill: "#60a5fa", stroke: "#1d4ed8", "stroke-width": 1.5 }));
      // head
      g.appendChild(el("circle", { cx: cx + 16, cy: bodyY - 16, r: 9, fill: "#fde68a", stroke: "#b45309", "stroke-width": 1.5 }));
      g.appendChild(el("circle", { cx: cx + 19, cy: bodyY - 18, r: 1.6, fill: "#1f2937" }));
      // 2 standing legs (chicken's natural 2 legs) — WHITE to stand out on dark bg

  /* ---------- 2. 将军饮马：对称点最短路（可拖动） ---------- */
  function general(box) {
    box.innerHTML = "";

    const riverY = 190, x0 = 40, x1 = 600;
    const A = [180, 80], B = [450, 95];
    const Bp = [B[0], 2 * riverY - B[1]]; // 对称点
    // river
    svg.appendChild(el("rect", { x: x0, y: riverY, width: x1 - x0, height: 26, fill: "#0ea5e9", opacity: 0.25 }));
    svg.appendChild(el("line", { x1: x0, y1: riverY + 13, x2: x1, y2: riverY + 13, stroke: "#38bdf8", "stroke-width": 2 }));
    // optimal line A-B'
    const Mstar = lineIntersectX(A, Bp, riverY);
    svg.appendChild(el("line", { x1: A[0], y1: A[1], x2: Bp[0], y2: Bp[1], stroke: "#facc15", "stroke-width": 1.5, "stroke-dasharray": "6 5", opacity: 0.8 }));
    // B' (reflection)
    svg.appendChild(el("circle", { cx: Bp[0], cy: Bp[1], r: 6, fill: "#94a3b8" }));
    const lblBp = el("text", { x: Bp[0] + 10, y: Bp[1] + 4, fill: "#cbd5e1", "font-size": 13 }); lblBp.textContent = "B′(对称点)"; svg.appendChild(lblBp);
    // A, B

    svg.appendChild(el("circle", { cx: B[0], cy: B[1], r: 7, fill: "#f97316" }));
    const lblB = el("text", { x: B[0] + 10, y: B[1] - 10, fill: "#cbd5e1", "font-size": 13 }); lblB.textContent = "B"; svg.appendChild(lblB);
    // path A-M and M-B
    const pathAM = el("line", { x1: A[0], y1: A[1], x2: Mstar, y2: riverY + 13, stroke: "#e2e8f0", "stroke-width": 2 });
    const pathMB = el("line", { x1: Mstar, y1: riverY + 13, x2: B[0], y2: B[1], stroke: "#e2e8f0", "stroke-width": 2 });
    svg.appendChild(pathAM); svg.appendChild(pathMB);
    // M
    const M = el("circle", { cx: Mstar, cy: riverY + 13, r: 9, fill: "#fff", stroke: "#22c55e", "stroke-width": 3, style: "cursor:grab" });
    svg.appendChild(M);

    const cap = document.createElement("div"); cap.className = "anim-cap";
    const info = document.createElement("div"); info.className = "anim-cap"; info.style.color = "#facc15";
    function update(mx) {
      mx = Math.max(x0 + 10, Math.min(x1 - 10, mx));
      const m = [mx, riverY + 13];
      M.setAttribute("cx", mx);
      pathAM.setAttribute("x2", mx); pathMB.setAttribute("x1", mx);
      const s = dist(A, m) + dist(m, B);
      const best = dist(A, Bp);
      const diff = (s - best);
      cap.textContent = `当前 PA+PB = ${s.toFixed(0)}，理论最短(AB′) = ${best.toFixed(0)}`;
      if (diff < 2.5) { info.textContent = "✓ 已落在最短点：作 B 关于河岸的对称点 B′，连 A B′ 与河岸交点即最优。"; cap.style.color = "#86efac"; }
      else { info.textContent = ""; cap.style.color = "#cbd5e1"; }
    }
    update(Mstar);
    // drag
    let drag = false;
    function pos(e) { const r = svg.getBoundingClientRect(); const sx = 640 / r.width; return (e.clientX - r.left) * sx; }
    M.addEventListener("pointerdown", e => { drag = true; M.setAttribute("style", "cursor:grabbing"); M.setPointerCapture(e.pointerId); });
    svg.addEventListener("pointermove", e => { if (drag) update(pos(e)); });
    svg.addEventListener("pointerup", () => { drag = false; M.setAttribute("style", "cursor:grab"); });

    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const b1 = document.createElement("button"); b1.className = "btn"; b1.textContent = "⤴ 跳到最短点";
    b1.onclick = () => update(Mstar);
    ctrls.appendChild(b1);
    box.appendChild(svg); box.appendChild(cap); box.appendChild(info); box.appendChild(ctrls);

    function lineIntersectX(p, q, y) {
      // 直线 pq 与水平线 y 的交点 x
      const t = (y - p[1]) / (q[1] - p[1]);
      return p[0] + t * (q[0] - p[0]);
    }
  }

    svg.appendChild(el("circle", { cx: O[0], cy: O[1], r: R * k, fill: "none", stroke: "#f472b6", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));

    const opLine = el("line", { x1: O[0], y1: O[1], x2: O[0] + R, y2: O[1], stroke: "#475569", "stroke-width": 1 });
    svg.appendChild(opLine);

    svg.appendChild(oqLine);
    // P, Q dots
    const P = el("circle", { cx: O[0] + R, cy: O[1], r: 7, fill: "#38bdf8" });
    const Q = el("circle", { cx: O[0] + R * k, cy: O[1], r: 7, fill: "#f472b6" });
    svg.appendChild(P); svg.appendChild(Q);
    const lblP = el("text", { x: O[0] + R + 8, y: O[1] - 8, fill: "#7dd3fc", "font-size": 13 }); lblP.textContent = "豆 P"; svg.appendChild(lblP);
    const lblQ = el("text", { x: O[0] + R * k - 6, y: O[1] + 22, fill: "#f9a8d4", "font-size": 13 }); lblQ.textContent = "瓜 Q"; svg.appendChild(lblQ);

    const cap = document.createElement("div"); cap.className = "anim-cap";
    cap.textContent = "豆 P 绕 O 走圆；瓜 Q 由 P 绕 O 旋转 60° 并放大 1.4 倍得到 → Q 也走一个圆（轨迹同形）。点击暂停/继续。";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    let playing = true;
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "⏸ 暂停";

    ctrls.appendChild(btn);

    box.appendChild(svg); box.appendChild(cap); box.appendChild(ctrls);

    let ang = 0;
    function frame() {
      if (playing) ang += 0.012;
      const px = O[0] + R * Math.cos(ang), py = O[1] + R * Math.sin(ang);
      // Q = O + k * Rot(theta) * (P-O)
      const dx = px - O[0], dy = py - O[1];
      const rx = dx * Math.cos(theta) - dy * Math.sin(theta);
      const ry = dx * Math.sin(theta) + dy * Math.cos(theta);
      const qx = O[0] + k * rx, qy = O[1] + k * ry;
      P.setAttribute("cx", px); P.setAttribute("cy", py);
      Q.setAttribute("cx", qx); Q.setAttribute("cy", qy);
      opLine.setAttribute("x2", px); opLine.setAttribute("y2", py);
      oqLine.setAttribute("x2", qx); oqLine.setAttribute("y2", qy);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  /* ---------- 5. 动点问题：点沿矩形边移动，实时看 AP 距离与扫过面积 ---------- */
  function move(box) {
    box.innerHTML = "";
    const svg = el("svg", { viewBox: "0 0 600 320" });
    // 矩形 A(80,60) B(520,60) C(520,240) D(80,240)  — 动点 P 从 A 沿边到 C
    const A = [80, 60], Bp = [520, 60], C = [520, 240], D = [80, 240];
    const rect = el("polygon", { points: `${A} ${Bp} ${C} ${D}`.replace(/,/g, " "), fill: "rgba(56,189,248,0.08)", stroke: "#38bdf8", "stroke-width": 2 });
    // 注意 points 格式：用空格分隔坐标对
    rect.setAttribute("points", `${A[0]},${A[1]} ${Bp[0]},${Bp[1]} ${C[0]},${C[1]} ${D[0]},${D[1]}`);
    svg.appendChild(rect);
    function dot(p, c, r) { const e = el("circle", { cx: p[0], cy: p[1], r: r || 6, fill: c }); svg.appendChild(e); return e; }
    dot(A, "#22c55e"); dot(Bp, "#64748b"); dot(C, "#64748b"); dot(D, "#64748b");
    const lblA = el("text", { x: A[0] - 6, y: A[1] - 10, fill: "#86efac", "font-size": 13 }); lblA.textContent = "A"; svg.appendChild(lblA);
    const lblC = el("text", { x: C[0] + 8, y: C[1] + 4, fill: "#cbd5e1", "font-size": 13 }); lblC.textContent = "C"; svg.appendChild(lblC);
    // 轨迹：A→B→C（两段）
    const topLen = Bp[0] - A[0], rightLen = C[1] - Bp[1];
    const total = topLen + rightLen;
    const pathSeg = el("polyline", { points: `${A[0]},${A[1]} ${Bp[0]},${Bp[1]} ${C[0]},${C[1]}`, fill: "none", stroke: "#f59e0b", "stroke-width": 2, "stroke-dasharray": "6 4" });
    svg.appendChild(pathSeg);
    const P = dot([A[0], A[1]], "#fff", 9); P.setAttribute("stroke", "#22c55e"); P.setAttribute("stroke-width", 3);
    const APline = el("line", { x1: A[0], y1: A[1], x2: A[0], y2: A[1], stroke: "#f87171", "stroke-width": 2 }); svg.appendChild(APline);

    function posAt(t) { // t in [0,1]
      const d = t * total;
      if (d <= topLen) return [A[0] + d, A[1]];
      const dd = d - topLen; return [Bp[0], Bp[1] + dd];
    }
    const cap = document.createElement("div"); cap.className = "anim-cap"; cap.style.color = "#f87171";
    const info = document.createElement("div"); info.className = "anim-cap"; info.style.color = "#fbbf24";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    let t = 0, playing = true;
    const playBtn = document.createElement("button"); playBtn.className = "btn"; playBtn.textContent = "⏸ 暂停";
    playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "⏸ 暂停" : "▶ 继续"; };
    const slide = document.createElement("input"); slide.type = "range"; slide.min = "0"; slide.max = "100"; slide.value = "0"; slide.style.width = "180px";
    slide.oninput = () => { t = +slide.value / 100; playing = false; playBtn.textContent = "▶ 继续"; update(); };
    ctrls.appendChild(playBtn); ctrls.appendChild(slide);

    function update() {
      const p = posAt(t);
      P.setAttribute("cx", p[0]); P.setAttribute("cy", p[1]);
      APline.setAttribute("x2", p[0]); APline.setAttribute("y2", p[1]);
      const ap = Math.hypot(p[0] - A[0], p[1] - A[1]);
      const along = t * total;
      // 扫过面积：上半段为矩形(along * 180); 下半段加整上边矩形 + 右段矩形
      let area;
      if (along <= topLen) area = along * (C[1] - A[1]);
      else area = topLen * (C[1] - A[1]) + (along - topLen) * (Bp[0] - A[0]);
      cap.textContent = `动点 P 已走路程 = ${along.toFixed(0)}；AP 直线距离 = ${ap.toFixed(0)}`;
      info.textContent = `扫过矩形面积 = ${area.toFixed(0)}（面积在拐点处增长速率发生变化 → 分段函数思想）`;
    }
    update();
    box.appendChild(svg); box.appendChild(cap); box.appendChild(info); box.appendChild(ctrls);

    let last = 0;
    function frame(ts) {
      if (playing) {
        if (!last) last = ts;
        const dt = (ts - last) / 1000; last = ts;
        t += dt * 0.25; if (t > 1) t = 0; last = 0;
        slide.value = Math.round(t * 100); update();
      } else { last = 0; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

      const layerOf = i => i === 0 ? 0 : (i <= 2 ? 1 : 2);
      edges.forEach((e, i) => {
        const layer = i < 2 ? 1 : 2;
        if (step >= layer) svg.appendChild(el("line", { x1: e[0].x, y1: e[0].y, x2: e[1].x, y2: e[1].y, stroke: "#cbd5e1", "stroke-width": 2 }));
      });
      nodes.forEach((n, i) => {
        const layer = layerOf(i);
        if (step >= layer) {
          svg.appendChild(el("circle", { cx: n.x, cy: n.y, r: 14, fill: "#eef3ff", stroke: "#2f6fed", "stroke-width": 1.5 }));
          const t = el("text", { x: n.x - 12, y: n.y + 4, "font-size": 11, fill: "#334155" });
          t.textContent = labels[i];
          svg.appendChild(t);
        }
      });
      info.textContent = step === 0 ? "根节点" : step === 1 ? "第一层分支：2 种选择" : "第二层展开 → 2 × 2 = 4 种结果";
    }
    function advance() { step = step >= 2 ? 0 : step + 1; render(); }
    btn.onclick = () => { if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ 逐步生长"; return; } btn.textContent = "⏸ 自动"; timer = setInterval(advance, 900); };
    render();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：线性规划（目标线平移） ---------- */
  function linearprog(box) {
    box.innerHTML = "";
    const W = 320, H = 240, ox = 30, oy = 210;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:320px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: ox, y1: 20, x2: ox, y2: oy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: ox, y1: oy, x2: 300, y2: oy, stroke: "#334155", "stroke-width": 1.5 }));
    const sx = v => ox + v * 42, sy = v => oy - v * 42;
    svg.appendChild(el("polygon", { points: `${sx(0)},${sy(0)} ${sx(4)},${sy(0)} ${sx(0)},${sy(4)}`, fill: "#eef3ff", stroke: "#2f6fed", "stroke-width": 1.5 }));
    [[0, 4, "(0,4)"], [4, 0, "(4,0)"], [0, 0, "(0,0)"]].forEach(p => {
      svg.appendChild(el("circle", { cx: sx(p[0]), cy: sy(p[1]), r: 4, fill: "#dc2626" }));
      const t = el("text", { x: sx(p[0]) + (p[0] === 0 ? 6 : -30), y: sy(p[1]) + (p[1] === 0 ? 16 : -6), "font-size": 11, fill: "#dc2626" });
      t.textContent = p[2]; svg.appendChild(t);
    });
    const line = el("line", { x1: sx(0), y1: sy(0), x2: sx(0), y2: sy(0), stroke: "#d97706", "stroke-width": 2.5 });
    svg.appendChild(line);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let c = 0, timer = null;
    function draw() {
      const cc = Math.min(c, 4);
      line.setAttribute("x1", sx(0)); line.setAttribute("y1", sy(cc));
      line.setAttribute("x2", sx(cc)); line.setAttribute("y2", sy(0));
      info.textContent = `目标线 x+y = ${cc.toFixed(1)}：z 随高度增大，在顶点 (0,4) 处最大 = 4`;
      btn.textContent = `▶ 平移目标线（z=${cc.toFixed(1)}）`;
    }
    btn.onclick = () => { if (timer) { clearInterval(timer); timer = null; btn.textContent = "▶ 平移"; return; } btn.textContent = "⏸ 暂停"; timer = setInterval(() => { c += 0.4; if (c > 4.3) c = 0; draw(); }, 120); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：正态分布 3σ 区间阴影 ---------- */
  function normal(box) {
    box.innerHTML = "";
    const W = 360, H = 200, cx = 180, cy = 170, sigma = 55;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    const shade = el("rect", { x: cx, y: 20, width: 0, height: cy - 20, fill: "#eef3ff" });
    svg.appendChild(shade);
    let pts = [];
    for (let i = 0; i <= 160; i++) { const x = 10 + i * 2.125; const t = (x - cx) / sigma; pts.push([x, cy - 130 * Math.exp(-t * t / 2)]); }
    svg.appendChild(el("polyline", { points: pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "), fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: cy, stroke: "#64748b", "stroke-dasharray": "3 3" }));
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let k = 1;
    function draw() {
      const half = k * sigma;
      shade.setAttribute("x", cx - half); shade.setAttribute("width", half * 2);
      const map = { 1: "约 68.27%（[μ−σ, μ+σ]）", 2: "约 95.45%（[μ−2σ, μ+2σ]）", 3: "约 99.74%（[μ−3σ, μ+3σ]）" };
      info.textContent = "3σ 原则：" + map[k];
      btn.textContent = "切换区间（当前 " + k + "σ）";
    }
    btn.onclick = () => { k = k >= 3 ? 1 : k + 1; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：复数乘 i 旋转 ---------- */
  function cgeo(box) {
    box.innerHTML = "";
    const W = 300, H = 240, cx = 150, cy = 130, radius = Math.sqrt(60 * 60 + 50 * 50);
    let theta = Math.atan2(50, 60);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:300px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 20, y1: cy, x2: 280, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: 230, stroke: "#334155", "stroke-width": 1.5 }));
    const line = el("line", { x1: cx, y1: cy, x2: cx + 60, y2: cy - 50, stroke: "#2f6fed", "stroke-width": 2 });
    const dot = el("circle", { cx: cx + 60, cy: cy - 50, r: 6, fill: "#2f6fed" });
    const label = el("text", { x: cx + 70, y: cy - 55, fill: "#334155", "font-size": 13 });
    svg.appendChild(line); svg.appendChild(dot); svg.appendChild(label);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 乘 i（逆时针转 90°）";
    function draw() {
      const x = cx + radius * Math.cos(theta), y = cy - radius * Math.sin(theta);
      dot.setAttribute("cx", x.toFixed(1)); dot.setAttribute("cy", y.toFixed(1));
      line.setAttribute("x2", x.toFixed(1)); line.setAttribute("y2", y.toFixed(1));
      const a = Math.round(radius * Math.cos(theta)), b = Math.round(radius * Math.sin(theta));
      label.textContent = `z = ${a} + ${b}i`;
      info.textContent = "复数乘 i：辐角 +π/2，即逆时针旋转 90°。";
    }
    btn.onclick = () => { theta += Math.PI / 2; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：重要极限 sinx/x → 1 ---------- */
  function lim(box) {
    box.innerHTML = "";
    const W = 360, H = 200, cx = 180, cy = 150;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    svg.appendChild(el("line", { x1: cx, y1: 20, x2: cx, y2: 190, stroke: "#334155", "stroke-width": 1.5 }));
    const poly = el("polyline", { fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 });
    svg.appendChild(poly);
    const y1 = el("line", { x1: 10, y1: cy - 50, x2: 350, y2: cy - 50, stroke: "#16a34a", "stroke-dasharray": "4 3" });
    svg.appendChild(y1);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 让 x→0";
    let k = 1;
    function draw() {
      const span = 2.6 / k;
      let pts = [];
      for (let i = 0; i <= 120; i++) { const x = -span + i * (2 * span / 120); const px = cx + x * 60; let v = x === 0 ? 1 : Math.sin(x) / x; const py = cy - 50 * v; pts.push(px.toFixed(1) + "," + py.toFixed(1)); }
      poly.setAttribute("points", pts.join(" "));
      info.textContent = "x 区间 ±" + span.toFixed(2) + " 时，曲线在极限值 1（绿线）附近收敛。";
      btn.textContent = "▶ 让 x→0（当前 ×" + k + "）";
    }
    btn.onclick = () => { k = k >= 6 ? 1 : k + 1; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ---------- 拓展：函数图像变换 ---------- */
  function gtrans(box) {
    box.innerHTML = "";
    const W = 360, H = 220, cy = 180;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, style: "width:100%;max-width:360px;height:auto;display:block" });
    svg.appendChild(el("line", { x1: 10, y1: cy, x2: 350, y2: cy, stroke: "#334155", "stroke-width": 1.5 }));
    const base = el("path", { fill: "none", stroke: "#94a3b8", "stroke-width": 2 });
    const moved = el("path", { fill: "none", stroke: "#2f6fed", "stroke-width": 2.5 });
    svg.appendChild(base); svg.appendChild(moved);
    const info = document.createElement("div"); info.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn";
    let k = 0;
    const modes = [
      { name: "右移 a：y=f(x−a)", dx: 60, f: x => cy - 40 * Math.exp(-((x - 150 - 60) * (x - 150 - 60)) / 2000) },
      { name: "关于 y 轴：y=f(−x)", dx: 0, f: x => cy - 40 * Math.exp(-((150 - x) * (150 - x)) / 2000) },
      { name: "纵向拉伸 2 倍", dx: 0, f: x => cy - 80 * Math.exp(-((x - 150) * (x - 150)) / 2000) }
    ];
    function draw() {
      const m = modes[k % 3];
      let b = [], mv = [];
      for (let x = 20; x <= 340; x += 4) { b.push(x + "," + (cy - 40 * Math.exp(-((x - 150) * (x - 150)) / 2000)).toFixed(1)); mv.push(x + "," + m.f(x).toFixed(1)); }
      base.setAttribute("d", "M " + b.join(" L "));
      moved.setAttribute("d", "M " + mv.join(" L "));
      info.textContent = m.name;
      btn.textContent = "▶ 切换变换（" + ((k % 3) + 1) + "/3）";
    }
    btn.onclick = () => { k = (k + 1) % 3; draw(); };
    draw();
    box.appendChild(svg); box.appendChild(info); box.appendChild(ctrls); ctrls.appendChild(btn);
  }

  /* ============================================================
   * 小学低年级专属动图
   * ============================================================ */
  function txt(svg, x, y, s, size, color, anchor) {
    const t = el("text", { x: x, y: y, "font-size": size || 24, fill: color || "#1e293b", "text-anchor": anchor || "middle", "font-family": "system-ui, sans-serif" });
    t.textContent = s; svg.appendChild(t); return t;
  }

  /* ---------- 数一数：10 个一组圈一圈 ---------- */
  function countPoints(box) {
    box.innerHTML = "";
    const total = 37, cols = 10;
    const svg = el("svg", { viewBox: "0 0 480 210" });
    const cap = document.createElement("div"); cap.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 按 10 个一组圈一圈";
    ctrls.appendChild(btn);
    const rows = Math.ceil(total / cols);
    for (let i = 0; i < total; i++) {
      const r = Math.floor(i / cols), c = i % cols;
      svg.appendChild(el("circle", { cx: 30 + c * 42, cy: 28 + r * 42, r: 11, fill: "#60a5fa", stroke: "#1d4ed8", "stroke-width": 1.5 }));
    }
    const groups = Math.floor(total / cols), rem = total % cols;
    let step = 0;
    function draw() {
      svg.querySelectorAll(".grp").forEach(n => n.remove());
      if (step === 0) { cap.textContent = `一共 ${total} 个点，先试着 10 个一组来数。`; return; }
      for (let g = 0; g < step; g++) {
        svg.appendChild(el("rect", { x: 12, y: 10 + g * 42, width: cols * 42 - 4, height: 36, rx: 10, fill: "none", stroke: "#f59e0b", "stroke-width": 2.5, class: "grp" }));
      }
      cap.textContent = `已圈出 ${step} 组（每组 10 个）= ${step * 10} 个；剩下 ${rem} 个单独数，一共 ${step * 10 + rem} 个。`;
    }
    btn.addEventListener("click", () => { step = step >= groups ? 0 : step + 1; draw(); });
    draw();
    box.appendChild(cap); box.appendChild(svg); box.appendChild(ctrls);
  }

  /* ---------- 数位：位值拆解（几个十、几个一） ---------- */
  function placeValue(box) {
    box.innerHTML = "";
    const num = 47, tens = Math.floor(num / 10), ones = num % 10;
    const svg = el("svg", { viewBox: "0 0 480 200" });
    const cap = document.createElement("div"); cap.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 拆解位值";
    ctrls.appendChild(btn);
    let step = 0;
    function draw() {
      svg.innerHTML = "";
      for (let t = 0; t < tens; t++)
        for (let i = 0; i < 10; i++)
          svg.appendChild(el("rect", { x: 30 + t * 120 + i * 10, y: 35, width: 8, height: 34, rx: 2, fill: "#34d399", stroke: "#059669", "stroke-width": 1 }));
      for (let i = 0; i < ones; i++)
        svg.appendChild(el("rect", { x: 30 + tens * 120 + i * 14, y: 105, width: 10, height: 34, rx: 2, fill: "#fbbf24", stroke: "#b45309", "stroke-width": 1 }));
      txt(svg, 30 + (tens * 120) / 2, 22, `${num} = ? 个十 + ? 个一`, 14, "#64748b", "start");
      if (step >= 1) txt(svg, 30 + (tens * 120) / 2, 100, `十位 ${tens} → ${tens} 个十（绿条每格 1 个十）`, 13, "#059669", "start");
      if (step >= 2) txt(svg, 30 + tens * 120, 170, `个位 ${ones} → ${ones} 个一（黄块）；合起来 ${tens}×10+${ones}=${num}`, 13, "#b45309", "start");
      cap.textContent = step === 0 ? `${num} 由几个十、几个一组成？` :
        step === 1 ? `十位是 ${tens}，表示 ${tens} 个十。` :
        `个位是 ${ones}，表示 ${ones} 个一；${tens}×10 + ${ones} = ${num}。`;
    }
    btn.addEventListener("click", () => { step = step >= 2 ? 0 : step + 1; draw(); });
    draw();
    box.appendChild(cap); box.appendChild(svg); box.appendChild(ctrls);
  }

  /* ---------- 进位加法：列竖式（28 + 35） ---------- */
  function carryAdd(box) {
    box.innerHTML = "";
    const a = 28, b = 35, units = (a % 10) + (b % 10), carry = Math.floor(units / 10), res = a + b;
    const T = { ux: 235, tx: 175, hx: 115 }, y0 = 60, y1 = 105, yL = 125, yR = 175;
    const svg = el("svg", { viewBox: "0 0 320 240" });
    const cap = document.createElement("div"); cap.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 列竖式算进位";
    ctrls.appendChild(btn);
    let step = 0;
    function draw() {
      svg.innerHTML = "";
      txt(svg, T.tx, y0, String(Math.floor(a / 10)), 30); txt(svg, T.ux, y0, String(a % 10), 30);
      txt(svg, T.tx, y1, String(Math.floor(b / 10)), 30); txt(svg, T.ux, y1, String(b % 10), 30);
      txt(svg, T.ux - 22, y1, "+", 30, "#dc2626");
      svg.appendChild(el("line", { x1: T.hx - 14, y1: yL, x2: 255, y2: yL, stroke: "#334155", "stroke-width": 2 }));
      if (step >= 1) {
        const uo = units % 10;
        txt(svg, T.ux, yR, String(uo), 30, "#16a34a");
        if (carry) txt(svg, T.tx - 4, y0 - 22, "1", 22, "#dc2626");
        cap.textContent = `个位 ${a % 10}+${b % 10}=${units}，写 ${uo}，向十位进 1。`;
      } else cap.textContent = `列竖式：个位对齐个位、十位对齐十位。`;
      if (step >= 2) {
        const to = Math.floor(a / 10) + Math.floor(b / 10) + carry;
        txt(svg, T.tx, yR, String(to), 30, "#16a34a");
        if (to >= 10) txt(svg, T.hx, yR, String(Math.floor(to / 10)), 30, "#16a34a");
        cap.textContent = `十位 ${Math.floor(a / 10)}+${Math.floor(b / 10)}+进1=${to}；所以 ${a}+${b}=${res}。`;
      }
    }
    btn.addEventListener("click", () => { step = step >= 2 ? 0 : step + 1; draw(); });
    draw();
    box.appendChild(cap); box.appendChild(svg); box.appendChild(ctrls);
  }

  /* ---------- 退位减法：列竖式（52 − 27） ---------- */
  function borrowSub(box) {
    box.innerHTML = "";
    const a = 52, b = 27, res = a - b;
    const T = { ux: 235, tx: 175, hx: 115 }, y0 = 60, y1 = 105, yL = 125, yR = 175;
    const svg = el("svg", { viewBox: "0 0 320 240" });
    const cap = document.createElement("div"); cap.className = "anim-cap";
    const ctrls = document.createElement("div"); ctrls.className = "anim-ctrls";
    const btn = document.createElement("button"); btn.className = "btn"; btn.textContent = "▶ 列竖式算退位";
    ctrls.appendChild(btn);
    let step = 0;
    function draw() {
      svg.innerHTML = "";
      txt(svg, T.tx, y0, String(Math.floor(a / 10)), 30); txt(svg, T.ux, y0, String(a % 10), 30);
      txt(svg, T.tx, y1, String(Math.floor(b / 10)), 30); txt(svg, T.ux, y1, String(b % 10), 30);
      txt(svg, T.ux - 22, y1, "−", 30, "#dc2626");
      svg.appendChild(el("line", { x1: T.hx - 14, y1: yL, x2: 255, y2: yL, stroke: "#334155", "stroke-width": 2 }));
      if (step >= 1) {
        // 个位 2<7：十位借1，个位变12-7=5
        txt(svg, T.tx, y0 - 22, "˙", 26, "#dc2626");
        txt(svg, T.ux, yR, "5", 30, "#16a34a");
        txt(svg, T.tx, y0, "4", 30, "#2563eb"); // 十位变成4
        cap.textContent = `个位 ${a % 10}<${b % 10}，向十位借 1 当 10，${a % 10 + 10}-${b % 10}=5。`;
      } else cap.textContent = `列竖式：个位不够减，要退位借位。`;
      if (step >= 2) {
        const to = Math.floor(a / 10) - 1 - Math.floor(b / 10);
        txt(svg, T.tx, yR, String(to), 30, "#16a34a");
        cap.textContent = `十位 ${Math.floor(a / 10)}-1-${Math.floor(b / 10)}=${to}；所以 ${a}-${b}=${res}。`;
      }
    }
    btn.addEventListener("click", () => { step = step >= 2 ? 0 : step + 1; draw(); });
    draw();
    box.appendChild(cap); box.appendChild(svg); box.appendChild(ctrls);
  }

  return { chicken, general, melon, func, move, trip, geo, solid, conic, euler, taylor, numshape, tree, linearprog, normal, cgeo, lim, gtrans, countPoints, placeValue, carryAdd, borrowSub };
})();

  <!-- 参数化出题引擎（注册到 MM_TECH 的 qgen；并向 Fig 追加配图） -->
  <script>
/* ============================================================
 * 融会贯通 · 参数化出题引擎（小学核心 10 法）
 *  - 每个技巧注册 qgen(n)：每次生成 n 道全新随机题，真正不重样
 *  - 生成的题自带 q.fig，由 app.js 的 renderFigOf() 渲染配图
 *  - 学而思 / 作业帮 / 高途 通用套路：假设法、画图法、归一、找周期……
 * ============================================================ */
(function () {
  /* ---------- 通用工具 ---------- */
  const K = { ink: "#334155", sub: "#64748b", line: "#cbd5e1", pri: "#2f6fed", ok: "#16a34a", warn: "#d97706", red: "#dc2626", soft: "#eef3ff", blue: "#2563eb", purple: "#7c3aed" };
  function S(w, h, inner, maxw) {
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${maxw || w}px;height:auto;display:block" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(a) { return a[rnd(0, a.length - 1)]; }
  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // 由正确答构造 n 个互异选项（含正确项）；make() 生成干扰项
  function opts(ans, make, n) {
    n = n || 4;
    const set = new Set([ans]);
    let g = 0;
    while (set.size < n && g++ < 400) { const d = make(); if (d !== ans) set.add(d); }
    let k = 1;
    while (set.size < n) { set.add(ans + k); if (set.size < n) set.add(ans - k); k++; }
    const arr = shuffle([...set]).map(String);
    return { opts: arr, ans: arr.indexOf(String(ans)) };
  }

  function Q(q, optsObj, level, explain, point, fig) {
    return Object.assign({ q, level: level || "基础", explain, point: point || "" }, optsObj, { fig: fig || null });
  }

  /* ============================================================
   * 1. 鸡兔同笼（假设法 / 抬脚法）
   * ============================================================ */
  function qChicken() {
    const H = rnd(8, 18);
    const R = rnd(2, Math.max(3, H - 2));
    const C = H - R;
    const F = 2 * C + 4 * R;
    const askRabbit = Math.random() < 0.5;
    const ans = askRabbit ? R : C;
    const o = opts(ans, () => rnd(1, H - 1));
    const q = `鸡兔同笼：共有 ${H} 个头，${F} 只脚。问${askRabbit ? "兔" : "鸡"}有几只？`;
    const explain = askRabbit
      ? `假设全是鸡，应有 ${2 * H} 只脚，实际多 ${F - 2 * H} 只；每只兔比鸡多 2 脚，兔 = (${F} − ${2 * H}) ÷ 2 = ${R} 只。`
      : `假设全是兔，应有 ${4 * H} 只脚，实际少 ${4 * H - F} 只；每只鸡比兔少 2 脚，鸡 = (${4 * H} − ${F}) ÷ 2 = ${C} 只。`;
    return Q(q, o, "基础", explain, "假设法/抬脚法", { name: "gChicken", H, F, C, R });
  }

  /* ============================================================
   * 2. 植树问题（两端都栽 / 只栽一端 / 两端不栽 / 环形）
   * ============================================================ */
  function qPlant() {
    const d = pick([2, 4, 5, 10]);
    const seg = rnd(4, 12);
    const L = d * seg;
    const type = rnd(0, 3);
    const base = seg;
    let trees, mode, q, figMode, exp;
    if (type === 0) { trees = base + 1; mode = "both"; figMode = "both"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（两端都栽），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；两端都栽：棵数 = 间隔数 + 1 = ${base + 1}。`; }
    else if (type === 1) { trees = base; mode = "one"; figMode = "one"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（只栽一端），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；只栽一端：棵数 = 间隔数 = ${base}。`; }
    else if (type === 2) { trees = base - 1; mode = "none"; figMode = "none"; q = `一条 ${L} 米长的路，每隔 ${d} 米栽一棵（两端都不栽），共需多少棵树？`; exp = `间隔数 = ${L} ÷ ${d} = ${base}；两端不栽：棵数 = 间隔数 − 1 = ${base - 1}。`; }
    else { trees = base; mode = "ring"; figMode = "ring"; q = `一个周长 ${L} 米的圆形花坛，沿边每隔 ${d} 米栽一棵，共需多少棵树？`; exp = `封闭图形：棵数 = 间隔数 = ${L} ÷ ${d} = ${base}。`; }
    const o = opts(trees, () => Math.max(1, base + rnd(-2, 3)));
    return Q(q, o, "基础", exp, "植树三情形", { name: "gPlant", seg, mode: figMode });
  }

  /* ============================================================
   * 3. 和差倍问题（和差 / 和倍 / 差倍）
   * ============================================================ */
  function qSumDiff() {
    const type = rnd(0, 2);
    if (type === 0) {
      const D = rnd(4, 30); const big = rnd(D + 2, D + 30); const small = big - D; const Ssum = big + small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(small - 5, big + 5));
      const q = `两数之和是 ${Ssum}，差是 ${D}。问${askBig ? "较大的数" : "较小的数"}是多少？`;
      const exp = `较大 = (和 + 差) ÷ 2 = (${Ssum} + ${D}) ÷ 2 = ${big}；较小 = (和 − 差) ÷ 2 = (${Ssum} − ${D}) ÷ 2 = ${small}。`;
      return Q(q, o, "基础", exp, "和差公式", { name: "gSumdiff", big, small, type: "sd" });
    } else if (type === 1) {
      const m = rnd(2, 4); const small = rnd(3, 15); const big = small * m; const Ssum = big + small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(2, big + 5));
      const q = `两数之和是 ${Ssum}，大数是小数的 ${m} 倍。问${askBig ? "大数" : "小数"}是多少？`;
      const exp = `小数 = 和 ÷ (倍数 + 1) = ${Ssum} ÷ (${m} + 1) = ${small}；大数 = ${small} × ${m} = ${big}。`;
      return Q(q, o, "基础", exp, "和倍公式", { name: "gSumdiff", big, small, type: "sb" });
    } else {
      const m = rnd(2, 4); const small = rnd(2, 12); const big = small * m; const D = big - small;
      const askBig = Math.random() < 0.5; const ans = askBig ? big : small;
      const o = opts(ans, () => rnd(1, big + 5));
      const q = `两数之差是 ${D}，大数是小数的 ${m} 倍。问${askBig ? "大数" : "小数"}是多少？`;
      const exp = `小数 = 差 ÷ (倍数 − 1) = ${D} ÷ (${m} − 1) = ${small}；大数 = ${small} × ${m} = ${big}。`;
      return Q(q, o, "基础", exp, "差倍公式", { name: "gSumdiff", big, small, type: "db" });
    }
  }

  /* ============================================================
   * 4. 盈亏问题（一盈一亏 / 双盈 / 双亏）
   * ============================================================ */
  function qProfit() {
    const type = rnd(0, 2);
    const a = rnd(3, 6), c = a + rnd(1, 3);
    const N = rnd(3, 10);
    let q, ans, exp, fig, o;
    if (type === 0) {
      const diff = (c - a) * N;
      const b = rnd(1, diff - 1), dd = diff - b;
      ans = N; const thing = a * N + b;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：如果每人分 ${a} 颗，多出 ${b} 颗；如果每人分 ${c} 颗，反而少 ${dd} 颗。一共有几个小朋友？`;
      exp = `人数 = (盈 + 亏) ÷ 两次每份差 = (${b} + ${dd}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。（糖果共 ${thing} 颗）`;
      fig = { name: "gProfit", a, c, b, d: dd, N, thing };
    } else if (type === 1) {
      const diff = (c - a) * N;
      const b = rnd(diff + 1, diff + 12); const e = b - diff;
      ans = N; const thing = a * N + b;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：每人分 ${a} 颗多 ${b} 颗；每人分 ${c} 颗多 ${e} 颗。一共有几个小朋友？`;
      exp = `人数 = (大盈 − 小盈) ÷ 两次每份差 = (${b} − ${e}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。`;
      fig = { name: "gProfit", a, c, b, e, N, thing, kind: "双盈" };
    } else {
      const diff = (c - a) * N;
      const f = rnd(diff + 1, diff + 12); const g = f - diff;
      ans = N; const need = a * N + f;
      o = opts(ans, () => rnd(2, N + 8));
      q = `分糖果：每人分 ${a} 颗少 ${f} 颗；每人分 ${c} 颗少 ${g} 颗。一共有几个小朋友？`;
      exp = `人数 = (大亏 − 小亏) ÷ 两次每份差 = (${f} − ${g}) ÷ (${c} − ${a}) = ${diff} ÷ ${c - a} = ${N} 人。`;
      fig = { name: "gProfit", a, c, f, g, N, thing: need, kind: "双亏" };
    }
    return Q(q, o, "进阶", exp, "盈亏公式", fig);
  }

  /* ============================================================
   * 5. 平均数问题（求平均 / 已知平均求缺数）
   * ============================================================ */
  function qAvg() {
    const type = rnd(0, 1);
    if (type === 0) {
      const n = rnd(3, 5);
      const vals = []; let sum = 0;
      for (let i = 0; i < n; i++) { const v = rnd(60, 98); vals.push(v); sum += v; }
      const r = sum % n; if (r !== 0) { vals[n - 1] += (n - r); sum += (n - r); }
      const avg = sum / n;
      const o = opts(avg, () => rnd(50, 99));
      const q = `某小组 ${n} 次测验成绩分别为 ${vals.join("、")} 分，平均成绩是多少？`;
      const exp = `总数 = ${sum}，份数 = ${n}，平均数 = ${sum} ÷ ${n} = ${avg} 分。`;
      return Q(q, o, "基础", exp, "总数 ÷ 份数", { name: "gAvg", vals, avg, showAvg: false });
    } else {
      const n = rnd(3, 5);
      const avg = rnd(70, 90);
      const known = [];
      for (let i = 0; i < n - 1; i++) known.push(rnd(Math.max(45, avg - 15), avg));
      const sum = avg * n;
      const knownSum = known.reduce((x, y) => x + y, 0);
      const miss = sum - knownSum;
      const o = opts(miss, () => rnd(40, 120));
      const q = `前 ${n - 1} 次成绩为 ${known.join("、")} 分，要使平均分达到 ${avg} 分，第 ${n} 次至少要考多少分？`;
      const exp = `总分需 ${avg} × ${n} = ${sum}，已得 ${knownSum} 分，缺 = ${sum} − ${knownSum} = ${miss} 分。`;
      return Q(q, o, "进阶", exp, "平均数 × 份数", { name: "gAvg", vals: known.concat([miss]), avg, showAvg: true, missIndex: known.length });
    }
  }

  /* ============================================================
   * 6. 周期问题（找余数定位）
   * ============================================================ */
  function qCycle() {
    const T = rnd(2, 5);
    const letters = "ABCDEF".slice(0, T).split("");
    const n = rnd(T + 3, T + 20);
    const rem = n % T, pos = rem === 0 ? T : rem;
    const ansSym = letters[pos - 1];
    const optList = shuffle(letters.slice());
    const o = { opts: optList, ans: optList.indexOf(ansSym) };
    const q = `一串珠子按 ${letters.join("")} 的顺序不断重复排列。第 ${n} 个珠子是什么？`;
    const exp = `周期长 = ${T}。${n} ÷ ${T} = ${Math.floor(n / T)} …… ${rem === 0 ? T : rem}，余数定位周期里第 ${pos} 个 = ${ansSym}。`;
    return Q(q, o, "基础", exp, "找周期余数", { name: "gCycle", letters, highlight: pos - 1 });
  }

  /* ============================================================
   * 7. 归一问题（先求单一量 / 归总反求）
   * ============================================================ */
  function qGuiyi() {
    const type = rnd(0, 1);
    if (type === 0) {
      const ppl = rnd(2, 5), days = rnd(2, 6);
      const unit = rnd(3, 9);
      const total = unit * ppl * days;
      const p2 = rnd(2, 6), d2 = rnd(2, 6);
      const ans = unit * p2 * d2;
      const o = opts(ans, () => unit * rnd(1, 8) * rnd(1, 7));
      const q = `${ppl} 个工人 ${days} 天可生产零件 ${total} 个。照这样计算，${p2} 个工人 ${d2} 天可生产多少个？`;
      const exp = `单一量 = 总数 ÷ 人数 ÷ 天数 = ${total} ÷ ${ppl} ÷ ${days} = ${unit} 个/人天；${p2} 人 ${d2} 天 = ${unit} × ${p2} × ${d2} = ${ans} 个。`;
      return Q(q, o, "基础", exp, "先求单一量", { name: "gGuiyi", ppl, days, unit, p2, d2, ans });
    } else {
      const ppl = rnd(2, 5), days = rnd(3, 9);
      const total = ppl * days;
      let p2; do { p2 = rnd(2, 7); } while (total % p2 !== 0);
      const ans = total / p2;
      const o = opts(ans, () => Math.max(1, Math.round(total / rnd(1, 7))));
      const q = `一批任务，${ppl} 人做需 ${days} 天完成。若改为 ${p2} 人同时做（效率相同），需多少天？`;
      const exp = `总工作量 = ${ppl} × ${days} = ${total} 人·天；${p2} 人需 ${total} ÷ ${p2} = ${ans} 天。`;
      return Q(q, o, "进阶", exp, "归总（总量不变）", { name: "gGuiyi", ppl, days, p2, ans, total });
    }
  }

  /* ============================================================
   * 8. 工程问题（设总量为 1）
   * ============================================================ */
  const PAIRS = [[6, 3], [3, 6], [4, 4], [12, 4], [4, 12], [6, 6], [8, 8], [9, 6], [6, 9], [12, 6], [6, 12], [10, 15], [15, 10]];
  function qEngineer() {
    const type = rnd(0, 2);
    const pr = pick(PAIRS); const a = pr[0], b = pr[1];
    const coop = Math.round(a * b / (a + b));
    if (type === 0) {
      const o = opts(coop, () => rnd(2, Math.max(coop + 3, a, b)));
      const q = `一项工程，甲单独做需 ${a} 天，乙单独做需 ${b} 天。两人合作需几天完成？`;
      const exp = `甲效 = 1/${a}，乙效 = 1/${b}；合作效 = 1/${a} + 1/${b} = (${a} + ${b})/${a * b}；时间 = 1 ÷ (${(a + b)}/${a * b}) = ${a * b} ÷ (${a + b}) = ${coop} 天。`;
      return Q(q, o, "基础", exp, "工程问题（设总量为1）", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "乙", v: b }] });
    } else if (type === 1) {
      const o = opts(b, () => rnd(2, a + 10));
      const q = `一项工程，甲单独做需 ${a} 天，甲乙合作需 ${coop} 天。乙单独做需几天？`;
      const exp = `1/${a} + 1/乙 = 1/${coop} → 1/乙 = 1/${coop} − 1/${a} = (${a} − ${coop})/(${a * coop}) → 乙 = ${a * coop} ÷ (${a} − ${coop}) = ${b} 天。`;
      return Q(q, o, "进阶", exp, "合作效率反求", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "合作", v: coop }] });
    } else {
      const save = a - coop;
      const o = opts(save, () => rnd(1, Math.max(save + 3, a)));
      const q = `甲单独做 ${a} 天，两人合作 ${coop} 天。合作比甲单独少用几天？`;
      const exp = `甲单独 ${a} 天，合作 ${coop} 天，少用 ${a} − ${coop} = ${save} 天（效率越高用时越短）。`;
      return Q(q, o, "基础", exp, "效率比较", { name: "gEngineer", bars: [{ l: "甲", v: a }, { l: "合作", v: coop }] });
    }
  }

  /* ============================================================
   * 9. 相遇问题（求时间 / 求路程 / 求一速度）
   * ============================================================ */
  function qMeet() {
    const type = rnd(0, 2);
    const v1 = rnd(40, 90), v2 = rnd(30, 80);
    const vsum = v1 + v2;
    if (type === 0) {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(t, () => rnd(1, t + 4));
      const q = `甲、乙从相距 ${s} 千米两地同时相向出发，甲速 ${v1} 千米/时，乙速 ${v2} 千米/时。几小时相遇？`;
      const exp = `相遇时间 = 路程 ÷ 速度和 = ${s} ÷ (${v1} + ${v2}) = ${s} ÷ ${vsum} = ${t} 小时。`;
      return Q(q, o, "基础", exp, "相遇：s=(v1+v2)t", { name: "gMeet", s, v1, v2, t, show: { s: 1, v1: 1, v2: 1, t: 0 } });
    } else if (type === 1) {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(s, () => vsum * rnd(1, t + 2));
      const q = `甲速 ${v1} 千米/时、乙速 ${v2} 千米/时，相向而行 ${t} 小时后相遇。两地相距多少千米？`;
      const exp = `路程 = 速度和 × 时间 = (${v1} + ${v2}) × ${t} = ${vsum} × ${t} = ${s} 千米。`;
      return Q(q, o, "基础", exp, "相遇：s=(v1+v2)t", { name: "gMeet", s, v1, v2, t, show: { s: 0, v1: 1, v2: 1, t: 1 } });
    } else {
      const t = rnd(2, 6); const s = vsum * t;
      const o = opts(v2, () => rnd(20, v1 + 40));
      const q = `两地相距 ${s} 千米，相向而行 ${t} 小时相遇；甲速 ${v1} 千米/时，乙速多少？`;
      const exp = `速度和 = ${s} ÷ ${t} = ${vsum}；乙速 = 速度和 − 甲速 = ${vsum} − ${v1} = ${v2} 千米/时。`;
      return Q(q, o, "进阶", exp, "相遇：求速度和", { name: "gMeet", s, v1, v2, t, show: { s: 1, v1: 1, v2: 0, t: 1 } });
    }
  }

  /* ============================================================
   * 10. 追及问题（求时间 / 求路程差 / 求一速度）
   * ============================================================ */
  function qChase() {
    const type = rnd(0, 2);
    const v2 = rnd(30, 70), dv = rnd(5, 30), v1 = v2 + dv;
    if (type === 0) {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(t, () => rnd(1, t + 4));
      const q = `甲速 ${v1} 千米/时，乙速 ${v2} 千米/时，乙先走 ${ds} 千米后甲同向追乙。几小时追上？`;
      const exp = `追及时间 = 路程差 ÷ 速度差 = ${ds} ÷ (${v1} − ${v2}) = ${ds} ÷ ${dv} = ${t} 小时。`;
      return Q(q, o, "基础", exp, "追及：t=Δs÷(v1−v2)", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 1, ds: 1, t: 0 } });
    } else if (type === 1) {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(ds, () => dv * rnd(1, t + 3));
      const q = `甲速 ${v1} 千米/时、乙速 ${v2} 千米/时，同向而行，${t} 小时后甲追上乙。乙先走了多少千米？`;
      const exp = `路程差 = 速度差 × 时间 = (${v1} − ${v2}) × ${t} = ${dv} × ${t} = ${ds} 千米。`;
      return Q(q, o, "基础", exp, "追及：Δs=(v1−v2)t", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 1, ds: 0, t: 1 } });
    } else {
      const t = rnd(2, 6); const ds = dv * t;
      const o = opts(v2, () => rnd(20, v1 + 10));
      const q = `甲速 ${v1} 千米/时，乙先走 ${ds} 千米，${t} 小时后甲追上乙。乙速多少？`;
      const exp = `速度差 = 路程差 ÷ 时间 = ${ds} ÷ ${t} = ${dv}；乙速 = 甲速 − 速度差 = ${v1} − ${dv} = ${v2} 千米/时。`;
      return Q(q, o, "进阶", exp, "追及：求速度差", { name: "gChase", v1, v2, ds, t, show: { v1: 1, v2: 0, ds: 1, t: 1 } });
    }
  }

  /* ============================================================

  // 顶部括号标注（用于线段图），只标"题目已给出的量"，绝不标答案
  function bracket(x1, x2, y, label) {
